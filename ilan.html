```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | İlan Detayı</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#0f172a;
    color:white;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 5px 25px rgba(15,23,42,.15);
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#e5e7eb;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#60a5fa;
}

/* MAIN */

.container{
    max-width:1150px;
    margin:45px auto;
    padding:0 20px;
}

/* BACK */

.back{
    display:inline-block;
    margin-bottom:25px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

/* DETAIL */

.detail-box{
    background:white;
    border-radius:25px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    box-shadow:0 15px 45px rgba(15,23,42,.09);
}

/* IMAGE */

.main-image{
    width:100%;
    height:500px;
    background:#e2e8f0;
    overflow:hidden;
}

.main-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* CONTENT */

.content{
    padding:35px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.title-area h1{
    margin:0 0 12px;
    font-size:34px;
}

.location{
    color:#64748b;
    font-size:15px;
}

.price{
    color:#2563eb;
    font-size:32px;
    font-weight:900;
    white-space:nowrap;
}

.badge{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:8px 13px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:18px;
}

/* DETAILS */

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin:35px 0;
}

.detail{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
}

.detail-icon{
    font-size:25px;
    margin-bottom:10px;
}

.detail-label{
    color:#64748b;
    font-size:13px;
    margin-bottom:5px;
}

.detail-value{
    font-size:17px;
    font-weight:bold;
}

/* DESCRIPTION */

.description{
    margin-top:30px;
}

.description h2{
    font-size:24px;
    margin-bottom:12px;
}

.description p{
    color:#64748b;
    line-height:1.8;
    white-space:pre-line;
}

/* CONTACT */

.contact{
    margin-top:35px;
    padding:25px;
    border-radius:18px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
}

.contact h2{
    margin-top:0;
}

.contact-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.contact-button{
    display:inline-block;
    padding:14px 22px;
    border-radius:11px;
    text-decoration:none;
    color:white;
    font-weight:bold;
}

.whatsapp{
    background:#16a34a;
}

.phone{
    background:#2563eb;
}

/* LOADING */

.loading{
    text-align:center;
    background:white;
    border-radius:20px;
    padding:70px 20px;
}

.loading h2{
    margin-bottom:10px;
}

.loading p{
    color:#64748b;
}

/* ERROR */

.error{
    text-align:center;
    background:white;
    border-radius:20px;
    padding:70px 20px;
}

.error h2{
    margin-bottom:10px;
}

.error p{
    color:#64748b;
}

.error a{
    display:inline-block;
    margin-top:15px;
    padding:13px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

/* FOOTER */

footer{
    margin-top:80px;
    background:#0f172a;
    color:white;
    padding:50px 20px;
    text-align:center;
}

footer p{
    color:#cbd5e1;
}

/* MOBILE */

@media(max-width:800px){

    header{
        flex-direction:column;
        gap:15px;
        padding:16px;
    }

    nav{
        gap:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .main-image{
        height:320px;
    }

    .content{
        padding:25px 20px;
    }

    .top{
        flex-direction:column;
    }

    .title-area h1{
        font-size:27px;
    }

    .price{
        font-size:27px;
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:450px){

    .details{
        grid-template-columns:1fr;
    }

    .contact-button{
        width:100%;
        text-align:center;
    }

}

</style>

</head>

<body>


<header>

<a href="index.html" class="logo">
🏠 NOVA EMLAK
</a>

<nav>

<a href="index.html">
Ana Sayfa
</a>

<a href="index.html#ilanlar">
İlanlar
</a>

<a href="index.html#favoriler">
❤️ Favoriler
</a>

<a href="index.html#iletisim">
İletişim
</a>

</nav>

</header>


<div class="container">

<a
href="index.html"
class="back"
>
← İlanlara Geri Dön
</a>


<div id="page">

<div class="loading">

<h2>
🏠 İlan yükleniyor...
</h2>

<p>
Lütfen bekleyin.
</p>

</div>

</div>

</div>


<footer>

<h2>
🏠 Nova Emlak
</h2>

<p>
📞 0555 555 55 55
</p>

<p>
📍 İstanbul
</p>

<p>
Gayrimenkulde doğru adres.
</p>

<p>
© 2026 Nova Emlak
</p>

</footer>


<script>

/* HTML GÜVENLİĞİ */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* GÖRSEL */

function getImage(ilan){

if(
ilan.image &&
typeof ilan.image === "string"
){

return ilan.image;

}

if(
Array.isArray(ilan.images) &&
ilan.images.length > 0
){

return ilan.images[0];

}

return "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=85";

}


/* URL'DEN ID AL */

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");


/* İLANI YÜKLE */

async function loadListing(){

const page =
document.getElementById("page");


if(!id){

page.innerHTML = `

<div class="error">

<h2>
❌ İlan bulunamadı
</h2>

<p>
İlan numarası belirtilmemiş.
</p>

<a href="index.html">
Ana Sayfaya Dön
</a>

</div>

`;

return;

}


try{

const response =
await fetch(
"/api/ilanlar",
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"API bağlantısı başarısız."
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"Geçersiz ilan verisi."
);

}


/* ID KARŞILAŞTIR */

const ilan =
data.find(
item =>
String(item.id) === String(id)
);


if(!ilan){

page.innerHTML = `

<div class="error">

<h2>
😔 İlan bulunamadı
</h2>

<p>
Bu ilan artık mevcut olmayabilir.
</p>

<a href="index.html">
İlanlara Dön
</a>

</div>

`;

return;

}


/* VERİLER */

const image =
getImage(ilan);


const price =
Number(
ilan.price || 0
).toLocaleString(
"tr-TR"
);


const location =
[
ilan.city,
ilan.district
]
.filter(Boolean)
.join(" • ");


const phone =
"905555555555";


const title =
ilan.title ||
"Nova Emlak İlanı";


const description =
ilan.description ||
"Bu ilan hakkında detaylı bilgi için bizimle iletişime geçebilirsiniz.";


/* SAYFAYI OLUŞTUR */

page.innerHTML = `

<div class="detail-box">


<div class="main-image">

<img
src="${escapeHTML(image)}"
alt="${escapeHTML(title)}"
onerror="
this.onerror=null;
this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=85';
"
>

</div>


<div class="content">


<div class="top">


<div class="title-area">

<span class="badge">

${escapeHTML(
ilan.type || "İlan"
)}

</span>


<h1>

${escapeHTML(title)}

</h1>


<div class="location">

📍 ${
escapeHTML(
location || "-"
)
}

</div>

</div>


<div class="price">

${price} TL

</div>


</div>


<div class="details">


<div class="detail">

<div class="detail-icon">
🛏️
</div>

<div class="detail-label">
Oda Sayısı
</div>

<div class="detail-value">

${escapeHTML(
ilan.rooms || "-"
)}

</div>

</div>


<div class="detail">

<div class="detail-icon">
📐
</div>

<div class="detail-label">
Alan
</div>

<div class="detail-value">

${escapeHTML(
ilan.area || "-"
)} m²

</div>

</div>


<div class="detail">

<div class="detail-icon">
🏢
</div>

<div class="detail-label">
Bina Yaşı
</div>

<div class="detail-value">

${escapeHTML(
ilan.buildingAge || "-"
)}

</div>

</div>


<div class="detail">

<div class="detail-icon">
🏠
</div>

<div class="detail-label">
İlan Türü
</div>

<div class="detail-value">

${escapeHTML(
ilan.type || "-"
)}

</div>

</div>


</div>


<div class="description">

<h2>
📋 İlan Açıklaması
</h2>

<p>
${escapeHTML(description)}
</p>

</div>


<div class="contact">

<h2>
📞 İlan Hakkında Bilgi Al
</h2>

<p>
Bu ilan hakkında daha fazla bilgi almak için bizimle iletişime geçebilirsiniz.
</p>


<div class="contact-buttons">


<a
class="contact-button whatsapp"
href="https://wa.me/${phone}?text=${encodeURIComponent(
"Merhaba, Nova Emlak sitesindeki '" +
title +
"' ilanı hakkında bilgi almak istiyorum."
)}"
target="_blank"
>

💬 WhatsApp'tan Yaz

</a>


<a
class="contact-button phone"
href="tel:+${phone}"
>

📞 Telefonla Ara

</a>


</div>

</div>


</div>

</div>

`;



/* SAYFA BAŞLIĞI */

document.title =
title +
" | Nova Emlak";


}catch(error){

console.error(
error
);


page.innerHTML = `

<div class="error">

<h2>
⚠️ İlan yüklenemedi
</h2>

<p>
İlan bilgileri alınırken bir sorun oluştu.
</p>

<a href="index.html">
Ana Sayfaya Dön
</a>

</div>

`;

}

}


/* BAŞLAT */

loadListing();

</script>


</body>
</html>
```
