<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | İlan Detayı</title>

<meta name="description" id="metaDescription" content="Nova Emlak ilan detayları.">
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#0f172a;
    color:white;
    padding:17px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#e5e7eb;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#60a5fa;
}

.container{
    max-width:1150px;
    margin:40px auto;
    padding:0 20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    box-shadow:0 15px 45px rgba(15,23,42,.09);
}

/* FOTOĞRAFLAR */

.gallery{
    background:#0f172a;
}

.main-photo{
    width:100%;
    height:520px;
    background:#e2e8f0;
}

.main-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.thumbs{
    display:flex;
    gap:10px;
    padding:12px;
    overflow-x:auto;
    background:#0f172a;
}

.thumb{
    width:95px;
    height:70px;
    flex:0 0 auto;
    border-radius:8px;
    overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;
}

.thumb.active{
    border-color:#60a5fa;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* İÇERİK */

.content{
    padding:35px;
}

.badge{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:8px 13px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

h1{
    margin:0 0 12px;
    font-size:36px;
}

.location{
    color:#64748b;
    font-size:16px;
    margin-bottom:20px;
}

.price{
    color:#2563eb;
    font-size:30px;
    font-weight:900;
    margin-bottom:25px;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:25px;
}

.detail{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    padding:16px;
    border-radius:12px;
}

.detail strong{
    display:block;
    color:#64748b;
    font-size:13px;
    margin-bottom:6px;
}

.detail span{
    font-weight:bold;
}

.extra{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
}

.extra-item{
    background:#f8fafc;
    padding:14px;
    border-radius:10px;
    color:#475569;
}

.description{
    border-top:1px solid #e5e7eb;
    margin-top:30px;
    padding-top:25px;
}

.description h2{
    margin-top:0;
}

.description p{
    color:#475569;
    line-height:1.8;
    white-space:pre-line;
}

/* BUTONLAR */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:30px;
}

.action{
    padding:16px;
    border-radius:12px;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.whatsapp{
    background:#16a34a;
    color:white;
}

.phone{
    background:#0f172a;
    color:white;
}

.favorite{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.favorite.active{
    color:#ef4444;
}

/* PAYLAŞ */

.share{
    margin-top:25px;
    padding:20px;
    background:#f8fafc;
    border-radius:15px;
}

.share h3{
    margin-top:0;
}

.share-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.share-button{
    border:0;
    padding:11px 15px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.copy{
    background:#e2e8f0;
}

.whatsapp-share{
    background:#16a34a;
    color:white;
}

/* HATA */

.loading,
.error{
    background:white;
    border-radius:20px;
    padding:70px 20px;
    text-align:center;
}

.error h2{
    margin-top:0;
}

.error a{
    display:inline-block;
    margin-top:15px;
    padding:13px 20px;
    background:#2563eb;
    color:white;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */

footer{
    margin-top:80px;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:50px 20px;
}

footer p{
    color:#cbd5e1;
}

/* MOBİL */

@media(max-width:800px){

    header{
        flex-direction:column;
        gap:15px;
        padding:16px;
    }

    nav{
        gap:14px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .container{
        margin:25px auto;
    }

    .main-photo{
        height:320px;
    }

    .content{
        padding:23px;
    }

    h1{
        font-size:28px;
    }

    .price{
        font-size:25px;
    }

    .details{
        grid-template-columns:1fr 1fr;
    }

    .extra{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
🏠 NOVA EMLAK
</a>

<nav>
<a href="index.html">Ana Sayfa</a>
<a href="index.html#ilanlar">İlanlar</a>
<a href="index.html#favoriler">❤️ Favoriler</a>
<a href="index.html#iletisim">İletişim</a>
</nav>

</header>

<div class="container">

<a href="index.html" class="back">
← İlanlara Dön
</a>

<div id="app">
<div class="loading">
🏠 İlan bilgileri yükleniyor...
</div>
</div>

</div>

<footer>

<h2>🏠 Nova Emlak</h2>

<p>📞 0555 555 55 55</p>
<p>📍 İstanbul</p>
<p>Gayrimenkulde doğru adres.</p>
<p>© 2026 Nova Emlak</p>

</footer>

<script>

let ilan = null;

let favorites = JSON.parse(
    localStorage.getItem("novaFavorites") || "[]"
);

/* HTML GÜVENLİĞİ */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* URL ID */

const params = new URLSearchParams(
    window.location.search
);

const id = params.get("id");

/* FAVORİ */

function saveFavorites(){

    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );
}

function isFavorite(){

    if(!ilan) return false;

    return favorites.includes(
        Number(ilan.id)
    );
}

function toggleFavorite(){

    if(!ilan) return;

    const ilanId = Number(ilan.id);

    if(favorites.includes(ilanId)){

        favorites = favorites.filter(
            x => x !== ilanId
        );

    }else{

        favorites.push(ilanId);

    }

    saveFavorites();
    updateFavoriteButton();
}

function updateFavoriteButton(){

    const button =
        document.getElementById("favoriteButton");

    if(!button) return;

    if(isFavorite()){

        button.textContent =
            "❤️ Favorilerden Çıkar";

        button.classList.add("active");

    }else{

        button.textContent =
            "♡ Favorilere Ekle";

        button.classList.remove("active");
    }
}

/* FOTOĞRAFLAR */

function getImages(){

    if(
        ilan &&
        Array.isArray(ilan.images) &&
        ilan.images.length
    ){

        return ilan.images.filter(Boolean).slice(0,4);
    }

    if(
        ilan &&
        ilan.image
    ){

        return [ilan.image];
    }

    return [
        "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85"
    ];
}

/* ANA FOTOĞRAFI DEĞİŞTİR */

function changePhoto(index){

    const images = getImages();

    if(!images[index]) return;

    const main =
        document.getElementById("mainPhoto");

    main.src = images[index];

    document
        .querySelectorAll(".thumb")
        .forEach((thumb,i)=>{

            thumb.classList.toggle(
                "active",
                i === index
            );

        });
}

/* İLANI GÖSTER */

function displayListing(){

    const app =
        document.getElementById("app");

    const images = getImages();

    const location = [
        ilan.city,
        ilan.district,
        ilan.neighborhood
    ]
    .filter(Boolean)
    .join(" • ");

    const price =
        Number(ilan.price || 0)
        .toLocaleString("tr-TR");

    let gallery = "";

    images.forEach((image,index)=>{

        gallery += `

        <div
            class="thumb ${index === 0 ? "active" : ""}"
            onclick="changePhoto(${index})"
        >
            <img
                src="${escapeHTML(image)}"
                alt="Fotoğraf ${index + 1}"
                onerror="this.style.display='none'"
            >
        </div>

        `;

    });

    app.innerHTML = `

    <div class="card">

        <div class="gallery">

            <div class="main-photo">

                <img
                    id="mainPhoto"
                    src="${escapeHTML(images[0])}"
                    alt="${escapeHTML(
                        ilan.title || "Nova Emlak ilanı"
                    )}"
                    onerror="
                        this.onerror=null;
                        this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85';
                    "
                >

            </div>

            ${
                images.length > 1
                ?
                `<div class="thumbs">${gallery}</div>`
                :
                ""
            }

        </div>

        <div class="content">

            <span class="badge">
                ${escapeHTML(ilan.type || "İlan")}
            </span>

            <h1>
                ${escapeHTML(
                    ilan.title || "Gayrimenkul İlanı"
                )}
            </h1>

            <div class="location">
                📍 ${escapeHTML(location || "-")}
            </div>

            <div class="price">
                ${price} TL
            </div>

            <div class="details">

                <div class="detail">
                    <strong>Oda</strong>
                    <span>
                        🛏️ ${escapeHTML(
                            ilan.rooms || "-"
                        )}
                    </span>
                </div>

                <div class="detail">
                    <strong>Alan</strong>
                    <span>
                        📐 ${escapeHTML(
                            ilan.area || "-"
                        )} m²
                    </span>
                </div>

                <div class="detail">
                    <strong>Bina Yaşı</strong>
                    <span>
                        🏢 ${escapeHTML(
                            ilan.buildingAge || 0
                        )} yaş
                    </span>
                </div>

                <div class="detail">
                    <strong>Kat</strong>
                    <span>
                        🏬 ${escapeHTML(
                            ilan.floor || "-"
                        )}
                    </span>
                </div>

            </div>

            <div class="extra">

                <div class="extra-item">
                    🔥 Isıtma:
                    ${escapeHTML(
                        ilan.heating || "-"
                    )}
                </div>

                <div class="extra-item">
                    🚿 Banyo:
                    ${escapeHTML(
                        ilan.bathrooms || "-"
                    )}
                </div>

                <div class="extra-item">
                    🌿 Balkon:
                    ${escapeHTML(
                        ilan.balcony || "-"
                    )}
                </div>

                <div class="extra-item">
                    🏦 Krediye Uygun:
                    ${escapeHTML(
                        ilan.credit || "-"
                    )}
                </div>

                <div class="extra-item">
                    📜 Tapu:
                    ${escapeHTML(
                        ilan.deed || "-"
                    )}
                </div>

                <div class="extra-item">
                    🏢 Toplam Kat:
                    ${escapeHTML(
                        ilan.totalFloors || "-"
                    )}
                </div>

            </div>

            ${
                ilan.description
                ?
                `
                <div class="description">

                    <h2>
                        📝 İlan Açıklaması
                    </h2>

                    <p>
                        ${escapeHTML(
                            ilan.description
                        )}
                    </p>

                </div>
                `
                :
                ""
            }

            <div class="actions">

                <a
                    href="https://wa.me/905555555555?text=${encodeURIComponent(
                        "Merhaba, şu ilan hakkında bilgi almak istiyorum: " +
                        (ilan.title || "") +
                        " - " +
                        window.location.href
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action whatsapp"
                >
                    💬 WhatsApp'tan Bilgi Al
                </a>

                <a
                    href="tel:05555555555"
                    class="action phone"
                >
                    📞 Telefonla Ara
                </a>

            </div>

            <button
                id="favoriteButton"
                class="favorite"
                onclick="toggleFavorite()"
            >
                ♡ Favorilere Ekle
            </button>

            <div class="share">

                <h3>
                    📤 İlanı Paylaş
                </h3>

                <div class="share-buttons">

                    <button
                        class="share-button whatsapp-share"
                        onclick="shareWhatsApp()"
                    >
                        💬 WhatsApp
                    </button>

                    <button
                        class="share-button copy"
                        onclick="copyLink()"
                    >
                        🔗 Linki Kopyala
                    </button>

                </div>

            </div>

        </div>

    </div>

    `;

    updateFavoriteButton();

    document.title =
        `${ilan.title || "İlan"} | Nova Emlak`;
}

/* WHATSAPP */

function shareWhatsApp(){

    if(!ilan) return;

    const text =
        `${ilan.title || "Nova Emlak ilanı"}

${window.location.href}`;

    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(text),
        "_blank"
    );
}

/* LINK KOPYALA */

async function copyLink(){

    try{

        await navigator.clipboard.writeText(
            window.location.href
        );

        alert("✅ İlan bağlantısı kopyalandı.");

    }catch(error){

        alert(
            "❌ Bağlantı kopyalanamadı."
        );
    }
}

/* İLANI GETİR */

async function loadListing(){

    const app =
        document.getElementById("app");

    if(!id){

        app.innerHTML = `

        <div class="error">

            <h2>
                ❌ İlan bulunamadı
            </h2>

            <p>
                İlan numarası belirtilmemiş.
            </p>

            <a href="index.html">
                Ana Sayfaya Dön
            </a>

        </div>

        `;

        return;
    }

    try{

        const response =
            await fetch(
                "/api/ilanlar",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "API bağlantısı başarısız."
            );
        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "Geçersiz ilan verisi."
            );
        }

        ilan =
            data.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if(!ilan){

            app.innerHTML = `

            <div class="error">

                <h2>
                    😔 İlan bulunamadı
                </h2>

                <p>
                    Bu ilan mevcut değil veya kaldırılmış olabilir.
                </p>

                <a href="index.html">
                    İlanlara Dön
                </a>

            </div>

            `;

            return;
        }

        displayListing();

    }catch(error){

        console.error(
            "İlan yükleme hatası:",
            error
        );

        app.innerHTML = `

        <div class="error">

            <h2>
                ⚠️ İlan yüklenemedi
            </h2>

            <p>
                Sunucuya bağlanırken bir hata oluştu.
            </p>

            <a href="index.html">
                Ana Sayfaya Dön
            </a>

        </div>

        `;
    }
}

loadListing();

</script>

</body>
</html>
