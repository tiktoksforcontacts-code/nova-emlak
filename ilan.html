<script>

let ilan = null;

let currentImage = 0;

let favorites =
JSON.parse(
localStorage.getItem("novaFavorites") || "[]"
);

const params =
new URLSearchParams(
window.location.search
);

const id =
Number(params.get("id"));


/* HTML GÜVENLİĞİ */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* DEĞER */

function value(value){

return (
value !== undefined &&
value !== null &&
String(value).trim() !== ""
)
?
escapeHTML(value)
:
"Belirtilmemiş";

}


/* FAVORİ */

function isFavorite(id){

return favorites.includes(
Number(id)
);

}

function toggleFavorite(){

if(!ilan) return;

const ilanId =
Number(ilan.id);

if(favorites.includes(ilanId)){

favorites =
favorites.filter(
x => x !== ilanId
);

}else{

favorites.push(ilanId);

}

localStorage.setItem(
"novaFavorites",
JSON.stringify(favorites)
);

updateFavoriteButton();

}

function updateFavoriteButton(){

const button =
document.getElementById(
"favoriteButton"
);

if(!button || !ilan) return;

if(isFavorite(ilan.id)){

button.classList.add("active");

button.innerHTML =
"❤️ Favorilerden Çıkar";

}else{

button.classList.remove("active");

button.innerHTML =
"♡ Favorilere Ekle";

}

}


/* FOTOĞRAFLARI AL */

function getImages(ilan){

let images = [];

/*
Önce images dizisini kullan.
*/

if(Array.isArray(ilan.images)){

images =
ilan.images
.filter(
image =>
typeof image === "string" &&
image.trim() !== ""
);

}

/*
Eğer images boşsa image alanını kullan.
*/

if(
images.length === 0 &&
typeof ilan.image === "string" &&
ilan.image.trim() !== ""
){

images = [
ilan.image.trim()
];

}

/*
Tekrarlanan fotoğrafları kaldır.
*/

images =
[...new Set(images)];

return images;

}


/* FOTOĞRAF HATALIYSA */

function imageError(img){

img.style.display = "none";

const parent =
img.parentElement;

if(parent){

parent.innerHTML = `
<div class="no-photo-box">
📷<br>
Fotoğraf yüklenemedi
</div>
`;

}

}


/* ANA FOTOĞRAF */

function showImage(index){

if(!ilan) return;

const images =
getImages(ilan);

if(!images.length) return;

if(index < 0){
index = images.length - 1;
}

if(index >= images.length){
index = 0;
}

currentImage = index;

const mainImage =
document.getElementById("mainImage");

if(mainImage){

mainImage.src =
images[index];

mainImage.onerror =
function(){

this.onerror = null;

this.src =
"https://placehold.co/1200x700/e2e8f0/64748b?text=Fotoğraf+Yüklenemedi";

};

}

const counter =
document.getElementById(
"galleryCounter"
);

if(counter){

counter.textContent =
(index + 1) +
" / " +
images.length;

}

document
.querySelectorAll(".gallery-thumb")
.forEach(
function(thumb,i){

thumb.classList.toggle(
"active",
i === index
);

}
);

}


/* BÜYÜK FOTOĞRAF */

function openModal(){

const images =
getImages(ilan);

if(!images.length) return;

const modal =
document.getElementById(
"photoModal"
);

const image =
document.getElementById(
"modalImage"
);

image.src =
images[currentImage];

modal.classList.add("show");

}

function closeModal(){

document
.getElementById("photoModal")
.classList.remove("show");

}


/* GALERİ */

function createGallery(){

const images =
getImages(ilan);

if(images.length === 0){

return `
<div class="gallery-empty">
📷 Fotoğraf bulunamadı
</div>
`;

}

let thumbs = "";

images.forEach(
function(image,index){

thumbs += `

<button
class="gallery-thumb ${index === 0 ? "active" : ""}"
onclick="showImage(${index})"
>

<img
src="${escapeHTML(image)}"
alt="İlan fotoğrafı ${index + 1}"
loading="lazy"
onerror="this.style.display='none'"
>

</button>

`;

});

return `

<div class="gallery-main">

<span class="type-badge">
${value(ilan.type)}
</span>

<img
id="mainImage"
src="${escapeHTML(images[0])}"
alt="${value(ilan.title)}"
onclick="openModal()"
>

<div
id="galleryCounter"
class="gallery-counter"
>
1 / ${images.length}
</div>

</div>

<div class="gallery-thumbs">

${thumbs}

</div>

`;

}

/* İLANI GETİR */

async function loadListing(){

const app =
document.getElementById("app");

if(!id){

app.innerHTML = `

<div class="error">

<h2>❌ İlan bulunamadı</h2>

<p>
Geçerli bir ilan numarası bulunamadı.
</p>

<a href="index.html#ilanlar">
← Ana Sayfaya Dön
</a>

</div>

`;

return;

}

try{

const response =
await fetch(
"/api/ilanlar",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"API bağlantısı başarısız."
);

}

const data =
await response.json();

if(!Array.isArray(data)){

throw new Error(
"Geçersiz ilan verisi."
);

}

ilan =
data.find(
item =>
Number(item.id) === id
);

if(!ilan){

app.innerHTML = `

<div class="error">

<h2>🏠 İlan bulunamadı</h2>

<p>
Bu ilan silinmiş veya mevcut değil.
</p>

<a href="index.html#ilanlar">
← İlanlara Dön
</a>

</div>

`;

return;

}

displayListing();

}catch(error){

console.error(
"İlan detay hatası:",
error
);

app.innerHTML = `

<div class="error">

<h2>⚠️ Bir sorun oluştu</h2>

<p>
İlan bilgileri yüklenemedi.
Lütfen tekrar deneyin.
</p>

<a href="index.html#ilanlar">
← İlanlara Dön
</a>

</div>

`;

}

}

if(event.key === "ArrowLeft"){

}
