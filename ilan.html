<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | İlan Detayı</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(15,23,42,.97);
    backdrop-filter:blur(12px);
    color:white;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 5px 25px rgba(15,23,42,.15);
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
}

nav{
    display:flex;
    gap:28px;
    align-items:center;
}

nav a{
    color:#e5e7eb;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#60a5fa;
}

/* ANA */

.container{
    max-width:1200px;
    margin:40px auto 80px;
    padding:0 20px;
}

/* GERİ */

.back{
    display:inline-block;
    margin-bottom:25px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

/* GRID */

.property{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:30px;
}

/* GALERİ */

.gallery{
    background:white;
    border-radius:22px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 35px rgba(15,23,42,.08);
}

.main-image{
    width:100%;
    height:520px;
    object-fit:cover;
    display:block;
}

.thumbnails{
    display:flex;
    gap:10px;
    padding:15px;
    overflow-x:auto;
}

.thumbnail{
    width:90px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    border:3px solid transparent;
    flex-shrink:0;
}

.thumbnail.active{
    border-color:#2563eb;
}

/* BİLGİ */

.info{
    background:white;
    border-radius:22px;
    padding:30px;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 35px rgba(15,23,42,.08);
}

.badge{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:8px 13px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

.info h1{
    margin:0 0 12px;
    font-size:34px;
    line-height:1.2;
}

.location{
    color:#64748b;
    font-size:15px;
    margin-bottom:22px;
}

.price{
    color:#2563eb;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.quick-details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:25px;
}

.quick{
    background:#f1f5f9;
    padding:15px;
    border-radius:12px;
}

.quick strong{
    display:block;
    font-size:18px;
    margin-bottom:4px;
}

.quick span{
    color:#64748b;
    font-size:13px;
}

/* FAVORİ */

.favorite-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#f1f5f9;
    color:#172033;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:12px;
}

.favorite-button.active{
    background:#fee2e2;
    color:#dc2626;
}

/* WHATSAPP */

.whatsapp-button{
    display:block;
    width:100%;
    text-align:center;
    padding:16px;
    border-radius:12px;
    background:#16a34a;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

.whatsapp-button:hover{
    background:#15803d;
}

/* DETAYLAR */

.details-section{
    margin-top:30px;
    background:white;
    border-radius:22px;
    padding:30px;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 35px rgba(15,23,42,.06);
}

.details-section h2{
    margin-top:0;
    font-size:26px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.detail{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:17px;
}

.detail-title{
    color:#64748b;
    font-size:13px;
    margin-bottom:7px;
}

.detail-value{
    font-weight:bold;
    font-size:15px;
}

/* AÇIKLAMA */

.description{
    margin-top:30px;
    background:white;
    border-radius:22px;
    padding:30px;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 35px rgba(15,23,42,.06);
}

.description h2{
    margin-top:0;
}

.description p{
    color:#475569;
    line-height:1.8;
    font-size:16px;
}

/* YÜKLENİYOR */

.loading{
    text-align:center;
    padding:100px 20px;
    font-size:20px;
    color:#64748b;
}

/* HATA */

.error{
    text-align:center;
    background:white;
    border-radius:20px;
    padding:70px 20px;
}

.error h2{
    margin-top:0;
}

.error a{
    display:inline-block;
    margin-top:15px;
    background:#2563eb;
    color:white;
    padding:13px 22px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:#0f172a;
    color:white;
    padding:50px 20px;
    text-align:center;
}

footer p{
    color:#cbd5e1;
}

/* MOBİL */

@media(max-width:850px){

    header{
        flex-direction:column;
        gap:15px;
        padding:16px;
    }

    nav{
        gap:14px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .property{
        grid-template-columns:1fr;
    }

    .main-image{
        height:350px;
    }

    .detail-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .container{
        margin-top:25px;
    }

    .info{
        padding:22px;
    }

    .info h1{
        font-size:27px;
    }

    .price{
        font-size:27px;
    }

    .quick-details{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .main-image{
        height:280px;
    }

}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
🏠 NOVA EMLAK
</a>

<nav>

<a href="index.html">
Ana Sayfa
</a>

<a href="index.html#ilanlar">
İlanlar
</a>

<a href="index.html#favoriler">
❤️ Favoriler
</a>

<a href="index.html#iletisim">
İletişim
</a>

</nav>

</header>


<div class="container">

<a href="index.html#ilanlar" class="back">
← İlanlara Geri Dön
</a>

<div id="content">

<div class="loading">
🏠 İlan bilgileri yükleniyor...
</div>

</div>

</div>


<footer>

<h2>
🏠 Nova Emlak
</h2>

<p>
📞 0555 555 55 55
</p>

<p>
📍 İstanbul
</p>

<p>
Gayrimenkulde doğru adres.
</p>

<p>
© 2026 Nova Emlak
</p>

</footer>


<script>

/* URL'DEN İLAN ID AL */

const params = new URLSearchParams(
window.location.search
);

const id =
params.get("id");


/* FAVORİLER */

let favorites =
JSON.parse(
localStorage.getItem("novaFavorites") || "[]"
);


/* FAVORİ KAYDET */

function saveFavorites(){

localStorage.setItem(
"novaFavorites",
JSON.stringify(favorites)
);

}


/* FAVORİ KONTROL */

function isFavorite(id){

return favorites.includes(
Number(id)
);

}


/* FAVORİ DEĞİŞTİR */

function toggleFavorite(){

const numberId =
Number(id);

if(
favorites.includes(numberId)
){

favorites =
favorites.filter(
item =>
item !== numberId
);

}else{

favorites.push(numberId);

}

saveFavorites();

renderFavoriteButton();

}


/* FAVORİ BUTONU */

function renderFavoriteButton(){

const button =
document.getElementById(
"favoriteButton"
);

if(!button){
    return;
}

if(
isFavorite(id)
){

button.classList.add("active");

button.innerHTML =
"❤️ Favorilerden Çıkar";

}else{

button.classList.remove("active");

button.innerHTML =
"♡ Favorilere Ekle";

}

}


/* HTML GÜVENLİĞİ */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* FOTOĞRAF */

function getImages(ilan){

let images = [];

if(
Array.isArray(ilan.images)
){

images =
ilan.images.filter(
image =>
typeof image === "string" &&
image.trim() !== ""
);

}

if(
images.length === 0 &&
ilan.image
){

images.push(
ilan.image
);

}

if(
images.length === 0
){

images.push(
"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80"
);

}

return images;

}


/* İLANI GÖSTER */

function displayListing(ilan){

const images =
getImages(ilan);

const location =
[
ilan.city,
ilan.district,
ilan.neighborhood
]
.filter(Boolean)
.join(" • ");


/* BAŞLIK */

document.title =
escapeHTML(
ilan.title || "Nova Emlak | İlan"
);


/* HTML */

document.getElementById(
"content"
).innerHTML = `

<div class="property">

<!-- GALERİ -->

<div class="gallery">

<img
id="mainImage"
class="main-image"
src="${escapeHTML(images[0])}"
alt="${escapeHTML(ilan.title)}"
onerror="
this.onerror=null;
this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80';
"
>

<div class="thumbnails">

${images.map(
function(image,index){

return `

<img
class="thumbnail ${index === 0 ? "active" : ""}"
src="${escapeHTML(image)}"
alt="İlan fotoğrafı ${index + 1}"
onclick="changeImage('${escapeHTML(image)}',this)"
onerror="this.style.display='none'"
>

`;

}
).join("")}

</div>

</div>


<!-- BİLGİ -->

<div class="info">

<span class="badge">

${escapeHTML(
ilan.type || "İlan"
)}

</span>


<h1>

${escapeHTML(
ilan.title || "İlan"
)}

</h1>


<div class="location">

📍 ${escapeHTML(
location || "Konum belirtilmemiş"
)}

</div>


<div class="price">

${Number(
ilan.price || 0
).toLocaleString("tr-TR")}

TL

</div>


<div class="quick-details">

<div class="quick">

<strong>
${escapeHTML(
ilan.rooms || "-"
)}
</strong>

<span>
🛏️ Oda
</span>

</div>


<div class="quick">

<strong>
${escapeHTML(
String(ilan.area || "-")
)} m²
</strong>

<span>
📐 Alan
</span>

</div>


<div class="quick">

<strong>
${escapeHTML(
String(ilan.buildingAge ?? "-")
)}
</strong>

<span>
🏢 Bina Yaşı
</span>

</div>


<div class="quick">

<strong>
${escapeHTML(
ilan.floor || "-"
)}
</strong>

<span>
🏙️ Kat
</span>

</div>

</div>


<button
id="favoriteButton"
class="favorite-button"
onclick="toggleFavorite()"
>
♡ Favorilere Ekle
</button>


<a
class="whatsapp-button"
href="https://wa.me/905555555555"
target="_blank"
>
💬 WhatsApp'tan İletişime Geç
</a>

</div>

</div>


<!-- DETAYLAR -->

<div class="details-section">

<h2>
🏠 İlan Detayları
</h2>


<div class="detail-grid">


<div class="detail">

<div class="detail-title">
Oda Sayısı
</div>

<div class="detail-value">
${escapeHTML(
ilan.rooms || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Brüt Alan
</div>

<div class="detail-value">
${escapeHTML(
String(ilan.area || "-")
)} m²
</div>

</div>


<div class="detail">

<div class="detail-title">
Bina Yaşı
</div>

<div class="detail-value">
${escapeHTML(
String(ilan.buildingAge ?? "-")
)} yaş
</div>

</div>


<div class="detail">

<div class="detail-title">
Bulunduğu Kat
</div>

<div class="detail-value">
${escapeHTML(
ilan.floor || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Toplam Kat
</div>

<div class="detail-value">
${escapeHTML(
String(ilan.totalFloors ?? "-")
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Isıtma
</div>

<div class="detail-value">
${escapeHTML(
ilan.heating || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Banyo
</div>

<div class="detail-value">
${escapeHTML(
ilan.bathrooms || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Balkon
</div>

<div class="detail-value">
${escapeHTML(
ilan.balcony || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Krediye Uygun
</div>

<div class="detail-value">
${escapeHTML(
ilan.credit || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Tapu Durumu
</div>

<div class="detail-value">
${escapeHTML(
ilan.deed || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
Şehir
</div>

<div class="detail-value">
${escapeHTML(
ilan.city || "-"
)}
</div>

</div>


<div class="detail">

<div class="detail-title">
İlçe
</div>

<div class="detail-value">
${escapeHTML(
ilan.district || "-"
)}
</div>

</div>


</div>

</div>


<!-- AÇIKLAMA -->

<div class="description">

<h2>
📝 İlan Açıklaması
</h2>

<p>
${escapeHTML(
ilan.description ||
"Bu ilan için henüz açıklama eklenmemiş."
)}
</p>

</div>

`;


/* FAVORİ BUTONUNU GÜNCELLE */

renderFavoriteButton();

}


/* FOTOĞRAF DEĞİŞTİR */

function changeImage(
image,
element
){

const main =
document.getElementById(
"mainImage"
);

if(main){

main.src =
image;

}

document
.querySelectorAll(".thumbnail")
.forEach(
function(item){

item.classList.remove(
"active"
);

}
);

element.classList.add(
"active"
);

}


/* API'DEN İLANLARI ÇEK */

async function loadListing(){

if(!id){

document.getElementById(
"content"
).innerHTML = `

<div class="error">

<h2>
❌ İlan bulunamadı
</h2>

<p>
İlan ID bilgisi bulunamadı.
</p>

<a href="index.html">
Ana Sayfaya Dön
</a>

</div>

`;

return;

}


try{

const response =
await fetch(
"/api/ilanlar",
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"API bağlantısı başarısız."
);

}


const data =
await response.json();


if(
!Array.isArray(data)
){

throw new Error(
"Geçersiz ilan verisi."
);

}


/* ID'YE GÖRE İLANI BUL */

const ilan =
data.find(
item =>
String(item.id) === String(id)
);


if(!ilan){

document.getElementById(
"content"
).innerHTML = `

<div class="error">

<h2>
😔 İlan Bulunamadı
</h2>

<p>
Bu ilan artık mevcut olmayabilir.
</p>

<a href="index.html#ilanlar">
İlanlara Dön
</a>

</div>

`;

return;

}


/* İLANI GÖSTER */

displayListing(ilan);


}catch(error){

console.error(
"İlan yükleme hatası:",
error
);

document.getElementById(
"content"
).innerHTML = `

<div class="error">

<h2>
⚠️ İlan Yüklenemedi
</h2>

<p>
İlan bilgileri alınırken bir sorun oluştu.
</p>

<a href="index.html#ilanlar">
İlanlara Dön
</a>

</div>

`;

}

}


/* BAŞLAT */

loadListing();

</script>

</body>
</html>
