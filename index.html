<script>

let ilan = null;

let favorites =
JSON.parse(
localStorage.getItem("novaFavorites") || "[]"
);


/* HTML GÜVENLİĞİ */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* URL'DEN ID AL */

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");


/* FAVORİ KONTROLÜ */

function isFavorite(){

if(!ilan){
return false;
}

return favorites.includes(
Number(ilan.id)
);

}


/* FAVORİ KAYDET */

function saveFavorites(){

localStorage.setItem(
"novaFavorites",
JSON.stringify(favorites)
);

}


/* FAVORİ DEĞİŞTİR */

function toggleFavorite(){

if(!ilan){
return;
}

const ilanId =
Number(ilan.id);

if(favorites.includes(ilanId)){

favorites =
favorites.filter(
x => x !== ilanId
);

}else{

favorites.push(ilanId);

}

saveFavorites();

updateFavoriteButton();

}


/* FAVORİ BUTONU */

function updateFavoriteButton(){

const button =
document.getElementById(
"favoriteButton"
);

if(!button){
return;
}

if(isFavorite()){

button.textContent =
"❤️ Favorilerden Çıkar";

button.classList.add(
"active"
);

}else{

button.textContent =
"♡ Favorilere Ekle";

button.classList.remove(
"active"
);

}

}


/* RESİM */

function getListingImage(){

if(
ilan &&
ilan.image &&
typeof ilan.image === "string"
){

return ilan.image;

}

if(
ilan &&
Array.isArray(ilan.images) &&
ilan.images.length > 0
){

return ilan.images[0];

}

return "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85";

}


/* SEO */

function updateSEO(){

if(!ilan){
return;
}

const title =
ilan.title ||
"Gayrimenkul İlanı";


const location =
[
ilan.city,
ilan.district,
ilan.neighborhood
]
.filter(Boolean)
.join(" • ");


let description =
ilan.description
?
String(ilan.description)
:
`${title} - Nova Emlak gayrimenkul ilanı. ${location}`;


description =
description.substring(0,155);


document.title =
`${title} | Nova Emlak`;


document
.getElementById("metaDescription")
.setAttribute(
"content",
description
);


document
.getElementById("ogTitle")
.setAttribute(
"content",
`${title} | Nova Emlak`
);


document
.getElementById("ogDescription")
.setAttribute(
"content",
description
);


document
.getElementById("twitterTitle")
.setAttribute(
"content",
`${title} | Nova Emlak`
);


document
.getElementById("twitterDescription")
.setAttribute(
"content",
description
);


const currentUrl =
window.location.href;


document
.getElementById("canonical")
.setAttribute(
"href",
currentUrl
);


document
.getElementById("ogUrl")
.setAttribute(
"content",
currentUrl
);


document
.getElementById("ogImage")
.setAttribute(
"content",
getListingImage()
);


document
.getElementById("twitterImage")
.setAttribute(
"content",
getListingImage()
);

}


/* İLANI GÖSTER */

function displayListing(){

const app =
document.getElementById("app");

const image =
getListingImage();


const location =
[
ilan.city,
ilan.district,
ilan.neighborhood
]
.filter(Boolean)
.join(" • ");


const price =
Number(
ilan.price || 0
).toLocaleString(
"tr-TR"
);


app.innerHTML = `

<div class="detail-card">

<div class="main-image">

<img
src="${escapeHTML(image)}"
alt="${escapeHTML(
ilan.title || "Nova Emlak ilanı"
)}"
onerror="
this.onerror=null;
this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85';
"
>

</div>


<div class="content">

<span class="badge">
${escapeHTML(
ilan.type || "İlan"
)}
</span>


<h1>
${escapeHTML(
ilan.title || "Gayrimenkul İlanı"
)}
</h1>


<div class="location">
📍 ${escapeHTML(
location || "-"
)}

${price} TL
</div>


<div class="details">

<span>
🛏️ ${escapeHTML(

</span>

</div>

<span>
📐 ${escapeHTML(

)} m²
</span>

</div>

</strong>

</span>

</div>

Kat

<span>
🏬 ${escapeHTML(
ilan.floor || "-"
)}
</span>

</div>


</div>


<div class="extra">

)}
</div>

<div class="extra-item">

)}

<div class="extra-item">

</div>

}

(ilan.title || "") +

target="_blank"
rel="noopener noreferrer"
class="action whatsapp"
>
💬 WhatsApp'tan Bilgi Al
</a>


<a
href="tel:05555555555"
class="action phone"
>
📞 Telefonla Ara
</a>

</div>


<button
id="favoriteButton"
class="favorite"
onclick="toggleFavorite()"
>
♡ Favorilere Ekle
</button>


<div class="share">

<h3>
📤 İlanı Paylaş
</h3>

<div class="share-buttons">

<button
class="share-button whatsapp-share"
onclick="shareWhatsApp()"
>
💬 WhatsApp
</button>


<button
class="share-button copy"
onclick="copyLink()"
>
🔗 Linki Kopyala
</button>

</div>

</div>


</div>

</div>

`;

updateFavoriteButton();

updateSEO();

}


/* WHATSAPP PAYLAŞ */

function shareWhatsApp(){

if(!ilan){
return;
}

const text =
`${ilan.title || "Nova Emlak ilanı"}

${window.location.href}`;


const url =
"https://wa.me/?text=" +
encodeURIComponent(text);


window.open(
url,
"_blank",
"noopener,noreferrer"
);

}


/* LINK KOPYALA */

async function copyLink(){

try{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"✅ İlan bağlantısı kopyalandı."
);

}catch(error){

console.error(error);

alert(
"❌ Bağlantı kopyalanamadı."
);

}

}


/* İLANI GETİR */

async function loadListing(){

const app =
document.getElementById("app");


if(!id){

app.innerHTML = `

<div class="error">

<h2>
❌ İlan bulunamadı
</h2>

<p>
İlan numarası belirtilmemiş.
</p>

<a href="index.html">
Ana Sayfaya Dön
</a>

</div>

`;

return;

}


try{

const response =
await fetch(
"/api/ilanlar",
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"API bağlantısı başarısız."
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"Geçersiz ilan verisi."
);

}


ilan =
data.find(
item =>
String(item.id) === String(id)
);


if(!ilan){

app.innerHTML = `

<div class="error">

<h2>
😔 İlan bulunamadı
</h2>

<p>
Bu ilan mevcut değil veya kaldırılmış olabilir.
</p>

<a href="index.html">
İlanlara Dön
</a>

</div>

`;

return;

}


displayListing();


}catch(error){

console.error(error);

app.innerHTML = `

<div class="error">

<h2>
⚠️ İlan yüklenemedi
</h2>

<p>
Sunucuya bağlanırken bir hata oluştu.
</p>

<a href="index.html">
Ana Sayfaya Dön
</a>

</div>

`;

}

}


/* BAŞLAT */

loadListing();

</script>
