<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | Hayalinizdeki Evi Bulun</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#1f2937;
}

header{
    background:#111827;
    color:white;
    padding:20px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

header h1{
    margin:0;
    font-size:24px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    padding:90px 20px;
    text-align:center;
    color:white;
}

.hero h2{
    font-size:42px;
    margin:0 0 15px;
}

.hero p{
    font-size:18px;
}

.search-box{
    max-width:1100px;
    margin:-40px auto 40px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    position:relative;
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
}

.filters select,
.filters input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.search-button{
    margin-top:18px;
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-title h2{
    margin:0;
}

.result{
    margin-bottom:20px;
    color:#6b7280;
}

.listings{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.2s;
    position:relative;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,0,0,.13);
}

.card img{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
}

.favorite{
    position:absolute;
    right:12px;
    top:12px;
    width:43px;
    height:43px;
    border-radius:50%;
    border:0;
    background:white;
    font-size:23px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
    z-index:2;
}

.favorite.active{
    color:#ef4444;
}

.card-content{
    padding:20px;
}

.badge{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.card h3{
    margin:5px 0 10px;
    font-size:21px;
}

.details{
    color:#6b7280;
    font-size:14px;
    margin-bottom:12px;
    line-height:1.7;
}

.price{
    font-size:22px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:15px;
}

.detail-button{
    display:block;
    text-align:center;
    background:#111827;
    color:white;
    padding:12px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.favorites-section{
    margin-top:55px;
    margin-bottom:50px;
}

.favorite-count{
    font-size:14px;
    color:#6b7280;
}

.empty{
    background:white;
    padding:50px 20px;
    text-align:center;
    border-radius:15px;
    color:#6b7280;
    grid-column:1/-1;
}

.empty button{
    margin-top:10px;
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.error-box{
    background:#fff1f2;
    border:1px solid #fecdd3;
    color:#9f1239;
    padding:20px;
    border-radius:12px;
    grid-column:1/-1;
}

footer{
    margin-top:70px;
    background:#111827;
    color:white;
    padding:35px 7%;
    text-align:center;
}

footer p{
    margin:8px;
}

@media(max-width:600px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

    .hero{
        padding:70px 20px;
    }

    .hero h2{
        font-size:30px;
    }

    .search-box{
        margin:20px;
    }

}
</style>
</head>

<body>

<header>

<h1>🏠 NOVA EMLAK</h1>

<nav>
<a href="index.html">Ana Sayfa</a>
<a href="#ilanlar">İlanlar</a>
<a href="#favoriler">❤️ Favoriler</a>
<a href="#iletisim">İletişim</a>
</nav>

</header>


<section class="hero">

<h2>Hayalinizdeki Evi Bulun</h2>

<p>
Satılık ve kiralık gayrimenkulleri kolayca keşfedin.
</p>

</section>


<div class="search-box">

<div class="filters">

<select id="type">
<option value="">Satılık + Kiralık</option>
<option value="Satılık">Satılık</option>
<option value="Kiralık">Kiralık</option>
</select>

<select id="city">
<option value="">Tüm şehirler</option>
<option value="İstanbul">İstanbul</option>
<option value="Ankara">Ankara</option>
<option value="İzmir">İzmir</option>
</select>

<select id="rooms">
<option value="">Tüm oda sayıları</option>
<option value="1+1">1+1</option>
<option value="2+1">2+1</option>
<option value="3+1">3+1</option>
<option value="4+1">4+1</option>
<option value="5+1">5+1</option>
</select>

<input
id="minPrice"
type="number"
placeholder="Min. fiyat TL"
>

<input
id="maxPrice"
type="number"
placeholder="Max. fiyat TL"
>

</div>

<button
class="search-button"
onclick="searchListings()"
>
🔎 İlanları Ara
</button>

</div>


<div class="container" id="ilanlar">

<div class="section-title">
<h2>🏡 İlanlar</h2>
</div>

<div
class="result"
id="result"
>
İlanlar yükleniyor...
</div>

<div
class="listings"
id="listings"
>
</div>


<section
class="favorites-section"
id="favoriler"
>

<div class="section-title">

<h2>❤️ Favorilerim</h2>

<span
class="favorite-count"
id="favoriteCount"
>
0 favori
</span>

</div>

<div
class="listings"
id="favoriteListings"
>
</div>

</section>

</div>


<footer id="iletisim">

<h3>Nova Emlak</h3>

<p>📞 0555 555 55 55</p>

<p>📍 İstanbul</p>

<p>© 2026 Nova Emlak</p>

</footer>


<script>

let allListings = [];

let favorites = [];

try{

    favorites =
        JSON.parse(
            localStorage.getItem("novaFavorites") || "[]"
        );

    if(!Array.isArray(favorites)){
        favorites=[];
    }

}catch(error){

    favorites=[];

}


/* =========================
   GÜVENLİ ELEMENT
========================= */

function el(id){

    return document.getElementById(id);

}


/* =========================
   FAVORİLER
========================= */

function saveFavorites(){

    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );

}


function isFavorite(id){

    return favorites.includes(Number(id));

}


function toggleFavorite(id){

    id=Number(id);

    if(isFavorite(id)){

        favorites =
            favorites.filter(
                x => x !== id
            );

    }else{

        favorites.push(id);

    }

    saveFavorites();

    displayListings(
        getCurrentFilteredListings()
    );

    displayFavorites();

}


/* =========================
   FOTOĞRAF
========================= */

function getImage(ilan){

    if(
        Array.isArray(ilan.images) &&
        ilan.images.length > 0
    ){

        return ilan.images[0];

    }

    if(ilan.image){

        return ilan.image;

    }

    return "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80";

}


/* =========================
   İLANLARI GETİR
========================= */

async function loadListings(){

    const result=el("result");
    const container=el("listings");

    if(!result || !container){

        console.error(
            "İlan alanları bulunamadı."
        );

        return;

    }


    try{

        const response =
            await fetch(
                "/api/ilanlar",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "API hata kodu: " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "API dizi döndürmedi."
            );

        }


        allListings=data;


        displayListings(allListings);

        displayFavorites();


    }catch(error){

        console.error(
            "İlan yükleme hatası:",
            error
        );


        result.textContent =
            "İlanlar yüklenemedi.";


        container.innerHTML=`

        <div class="error-box">

            <h3>⚠️ İlanlar yüklenemedi</h3>

            <p>
            Sunucuya bağlanırken bir sorun oluştu.
            </p>

            <button
            onclick="loadListings()"
            >
            🔄 Tekrar Dene
            </button>

        </div>

        `;

    }

}


/* =========================
   İLANLARI GÖSTER
========================= */

function displayListings(ilanlar){

    const container=el("listings");
    const result=el("result");


    if(!container){

        return;

    }


    container.innerHTML="";


    if(result){

        result.textContent =
            ilanlar.length +
            " ilan bulundu.";

    }


    if(
        !Array.isArray(ilanlar) ||
        ilanlar.length===0
    ){

        container.innerHTML=`

        <div class="empty">

            <h2>😔 İlan bulunamadı</h2>

            <p>
            Arama kriterlerini değiştirip tekrar deneyin.
            </p>

        </div>

        `;

        return;

    }


    ilanlar.forEach(function(ilan){

        const card =
            document.createElement("div");

        card.className="card";


        const favorite =
            isFavorite(ilan.id);


        const heart =
            favorite ? "❤️" : "♡";


        const active =
            favorite ? "active" : "";


        const image =
            getImage(ilan);


        card.innerHTML=`

        <button
        class="favorite ${active}"
        onclick="toggleFavorite(${Number(ilan.id)})"
        title="Favorilere ekle"
        >
        ${heart}
        </button>

        <img
        src="${image}"
        alt="${ilan.title || "İlan"}"
        loading="lazy"
        >

        <div class="card-content">

        <span class="badge">
        ${ilan.type || "İlan"}
        </span>

        <h3>
        ${ilan.title || "İsimsiz ilan"}
        </h3>

        <div class="details">

        📍 ${ilan.city || ""}

        ${ilan.district ? " / " + ilan.district : ""}

        <br>

        🛏️ ${ilan.rooms || "-"}

        &nbsp; • &nbsp;

        📐 ${ilan.area || 0} m²

        </div>

        <div class="price">

        ${Number(ilan.price || 0)
            .toLocaleString("tr-TR")} TL

        </div>

        <a
        class="detail-button"
        href="ilan.html?id=${encodeURIComponent(ilan.id)}"
        >
        İlanı İncele →
        </a>

        </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   FAVORİLERİ GÖSTER
========================= */

function displayFavorites(){

    const container =
        el("favoriteListings");

    const count =
        el("favoriteCount");


    if(!container){

        return;

    }


    const favoriteListings =
        allListings.filter(
            ilan =>
            favorites.includes(
                Number(ilan.id)
            )
        );


    if(count){

        count.textContent =
            favoriteListings.length +
            " favori";

    }


    container.innerHTML="";


    if(favoriteListings.length===0){

        container.innerHTML=`

        <div class="empty">

        <h2>❤️ Henüz favori ilanınız yok</h2>

        <p>
        Beğendiğiniz ilanların üzerindeki ❤️
        butonuna basarak favorilerinize ekleyebilirsiniz.
        </p>

        <button
        onclick="
        document.getElementById('ilanlar')
        .scrollIntoView({behavior:'smooth'})
        "
        >
        İlanlara Göz At
        </button>

        </div>

        `;

        return;

    }


    favoriteListings.forEach(function(ilan){

        const card =
            document.createElement("div");

        card.className="card";


        const image =
            getImage(ilan);


        card.innerHTML=`

        <button
        class="favorite active"
        onclick="toggleFavorite(${Number(ilan.id)})"
        >
        ❤️
        </button>

        <img
        src="${image}"
        alt="${ilan.title || "İlan"}"
        loading="lazy"
        >

        <div class="card-content">

        <span class="badge">
        ${ilan.type || "İlan"}
        </span>

        <h3>
        ${ilan.title || "İsimsiz ilan"}
        </h3>

        <div class="details">

        📍 ${ilan.city || ""}

        <br>

        🛏️ ${ilan.rooms || "-"}

        &nbsp; • &nbsp;

        📐 ${ilan.area || 0} m²

        </div>

        <div class="price">

        ${Number(ilan.price || 0)
            .toLocaleString("tr-TR")} TL

        </div>

        <a
        class="detail-button"
        href="ilan.html?id=${encodeURIComponent(ilan.id)}"
        >
        İlanı İncele →
        </a>

        </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   FİLTRE
========================= */

function getCurrentFilteredListings(){

    const type =
        el("type")
        ? el("type").value
        : "";


    const city =
        el("city")
        ? el("city").value
        : "";


    const rooms =
        el("rooms")
        ? el("rooms").value
        : "";


    const minPrice =
        el("minPrice")
        ? Number(el("minPrice").value) || 0
        : 0;


    const maxPrice =
        el("maxPrice")
        ? Number(el("maxPrice").value) || Infinity
        : Infinity;


    return allListings.filter(function(ilan){

        const typeOK =
            !type ||
            ilan.type === type;


        const cityOK =
            !city ||
            ilan.city === city;


        const roomsOK =
            !rooms ||
            ilan.rooms === rooms;


        const price =
            Number(ilan.price) || 0;


        const priceOK =
            price >= minPrice &&
            price <= maxPrice;


        return (
            typeOK &&
            cityOK &&
            roomsOK &&
            priceOK
        );

    });

}


/* =========================
   ARAMA
========================= */

function searchListings(){

    displayListings(
        getCurrentFilteredListings()
    );

}


/* =========================
   BAŞLAT
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadListings();

    }
);

</script>

</body>
</html>
