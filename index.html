<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | Hayalinizdeki Evi Bulun</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#172033;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.logo{
    font-size:24px;
    font-weight:800;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    opacity:.9;
}

nav a:hover{
    opacity:1;
}

/* HERO */

.hero{
    min-height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;

    background:
    linear-gradient(rgba(8,15,30,.62),rgba(8,15,30,.62)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=85");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:800px;
    padding:30px 20px;
}

.hero h1{
    font-size:52px;
    margin:0 0 15px;
    line-height:1.1;
}

.hero p{
    font-size:19px;
    opacity:.95;
}

/* SEARCH */

.search-box{
    max-width:1150px;
    margin:-55px auto 55px;
    position:relative;
    z-index:10;

    background:white;
    padding:28px;
    border-radius:18px;

    box-shadow:0 12px 40px rgba(0,0,0,.14);
}

.search-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.filters select,
.filters input{
    width:100%;
    height:48px;
    border:1px solid #dce1e8;
    border-radius:9px;
    padding:0 13px;
    font-size:14px;
    background:white;
    outline:none;
}

.filters select:focus,
.filters input:focus{
    border-color:#2563eb;
}

.search-button{
    width:100%;
    margin-top:15px;
    height:50px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.search-button:hover{
    background:#1d4ed8;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-header h2{
    margin:0;
    font-size:30px;
}

.result{
    color:#6b7280;
    margin-bottom:25px;
}

/* LISTINGS */

.listings{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:white;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
    transition:.2s;
    position:relative;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.13);
}

.image-wrapper{
    position:relative;
    height:230px;
    overflow:hidden;
}

.card-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.favorite{
    position:absolute;
    top:14px;
    right:14px;

    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    background:white;
    color:#374151;

    font-size:22px;
    cursor:pointer;

    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.favorite.active{
    color:#ef4444;
}

.badge{
    position:absolute;
    left:14px;
    top:14px;

    background:#2563eb;
    color:white;

    padding:7px 11px;
    border-radius:7px;

    font-size:12px;
    font-weight:700;
}

.card-content{
    padding:20px;
}

.card h3{
    margin:0 0 12px;
    font-size:20px;
    line-height:1.3;
}

.location{
    color:#6b7280;
    font-size:14px;
    margin-bottom:12px;
}

.details{
    display:flex;
    gap:10px;
    flex-wrap:wrap;

    color:#667085;
    font-size:13px;

    margin-bottom:15px;
}

.price{
    color:#2563eb;
    font-size:22px;
    font-weight:800;
    margin-bottom:16px;
}

.detail-button{
    display:block;
    width:100%;

    padding:12px;

    text-align:center;
    text-decoration:none;

    background:#111827;
    color:white;

    border-radius:9px;

    font-weight:700;
}

.detail-button:hover{
    background:#1f2937;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    background:white;
    border-radius:15px;
    padding:55px 20px;
    text-align:center;
    color:#6b7280;
}

.empty h3{
    color:#172033;
}

/* FAVORITES */

.favorites-section{
    margin-top:75px;
    margin-bottom:70px;
}

.favorite-count{
    color:#6b7280;
    font-size:14px;
}

/* FOOTER */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:45px 20px;
    margin-top:70px;
}

footer h3{
    margin:0 0 15px;
    font-size:22px;
}

footer p{
    margin:7px;
    color:#d1d5db;
}

/* MOBILE */

@media(max-width:900px){

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .listings{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    header{
        flex-direction:column;
        gap:15px;
        padding:16px 20px;
    }

    nav{
        gap:12px;
        flex-wrap:wrap;
        justify-content:center;
    }

    nav a{
        font-size:13px;
    }

    .hero{
        min-height:370px;
    }

    .hero h1{
        font-size:36px;
    }

    .hero p{
        font-size:16px;
    }

    .search-box{
        margin:20px;
        padding:20px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .listings{
        grid-template-columns:1fr;
    }

    .section-header{
        align-items:flex-start;
        gap:10px;
    }

    .section-header h2{
        font-size:25px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">
🏠 NOVA EMLAK
</div>

<nav>

<a href="index.html">Ana Sayfa</a>

<a href="#ilanlar">İlanlar</a>

<a href="#favoriler">❤️ Favoriler</a>

<a href="#iletisim">İletişim</a>

</nav>

</header>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>
Hayalinizdeki Evi Bulun
</h1>

<p>
Satılık ve kiralık gayrimenkulleri kolayca keşfedin.
</p>

</div>

</section>

<!-- SEARCH -->

<div class="search-box">

<div class="search-title">
🔎 Gayrimenkul Ara
</div>

<div class="filters">

<select id="type">

<option value="">
Satılık + Kiralık
</option>

<option value="Satılık">
Satılık
</option>

<option value="Kiralık">
Kiralık
</option>

</select>

<select id="city">

<option value="">
Tüm şehirler
</option>

<option value="İstanbul">
İstanbul
</option>

<option value="Ankara">
Ankara
</option>

<option value="İzmir">
İzmir
</option>

</select>

<select id="rooms">

<option value="">
Tüm oda sayıları
</option>

<option value="1+1">1+1</option>

<option value="2+1">2+1</option>

<option value="3+1">3+1</option>

<option value="4+1">4+1</option>

<option value="5+1">5+1</option>

</select>

<input
id="minPrice"
type="number"
placeholder="Min. fiyat TL"

>

<input
id="maxPrice"
type="number"
placeholder="Max. fiyat TL"

>

</div>

<button
class="search-button"
onclick="searchListings()"

>

🔎 İlanları Ara </button>

</div>

<!-- İLANLAR -->

<main class="container" id="ilanlar">

<div class="section-header">

<h2>
🏡 İlanlar
</h2>

</div>

<div
class="result"
id="result"
>
İlanlar yükleniyor...
</div>

<div
class="listings"
id="listings"
>
</div>

<!-- FAVORİLER -->

<section
class="favorites-section"
id="favoriler"
>

<div class="section-header">

<h2>
❤️ Favorilerim
</h2>

<span
class="favorite-count"
id="favoriteCount"

>

0 favori </span>

</div>

<div
class="listings"
id="favoriteListings"
>
</div>

</section>

</main>

<!-- FOOTER -->

<footer id="iletisim">

<h3>
Nova Emlak
</h3>

<p>
📞 0555 555 55 55
</p>

<p>
📍 İstanbul
</p>

<p>
© 2026 Nova Emlak
</p>

</footer>

<script>

/* =====================================
   VERİLER
===================================== */

let allListings = [];


/* =====================================
   FAVORİLER
===================================== */

let favorites = [];

try{

    favorites =
    JSON.parse(
        localStorage.getItem("novaFavorites") || "[]"
    );

    if(!Array.isArray(favorites)){
        favorites = [];
    }

}catch(error){

    favorites = [];

}


/* =====================================
   FAVORİ KAYDET
===================================== */

function saveFavorites(){

    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );

}


/* =====================================
   FAVORİ KONTROL
===================================== */

function isFavorite(id){

    return favorites.includes(Number(id));

}


/* =====================================
   FAVORİ DEĞİŞTİR
===================================== */

function toggleFavorite(id){

    id = Number(id);

    if(favorites.includes(id)){

        favorites =
        favorites.filter(
            favoriteId => favoriteId !== id
        );

    }else{

        favorites.push(id);

    }

    saveFavorites();

    displayListings(
        getCurrentFilteredListings()
    );

    displayFavorites();

}


/* =====================================
   İLANLARI API'DEN AL
===================================== */

async function loadListings(){

    const result =
        document.getElementById("result");

    try{

        const response =
            await fetch("/api/ilanlar", {
                cache:"no-store"
            });

        if(!response.ok){

            throw new Error(
                "API cevap vermedi: " +
                response.status
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "API ilan listesi göndermedi."
            );

        }

        allListings = data;

        displayListings(allListings);

        displayFavorites();

    }catch(error){

        console.error(
            "İlan yükleme hatası:",
            error
        );

        if(result){

            result.textContent =
                "İlanlar yüklenemedi. Lütfen sayfayı yenileyin.";

        }

        const container =
            document.getElementById("listings");

        if(container){

            container.innerHTML = `

                <div class="empty">

                    <h3>⚠️ İlanlar yüklenemedi</h3>

                    <p>
                    Sunucu ile bağlantı kurulamadı.
                    </p>

                    <button
                    class="search-button"
                    onclick="loadListings()"
                    >
                    Tekrar Dene
                    </button>

                </div>

            `;

        }

    }

}


/* =====================================
   FOTOĞRAF
===================================== */

function getImage(ilan){

    if(
        Array.isArray(ilan.images) &&
        ilan.images.length > 0
    ){

        return ilan.images[0];

    }

    if(ilan.image){

        return ilan.image;

    }

    return "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80";

}


/* =====================================
   İLANLARI GÖSTER
===================================== */

function displayListings(ilanlar){

    const container =
        document.getElementById("listings");

    const result =
        document.getElementById("result");

    if(!container) return;


    container.innerHTML = "";


    if(result){

        result.textContent =
            ilanlar.length +
            " ilan bulundu.";

    }


    if(ilanlar.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h3>😔 İlan bulunamadı</h3>

                <p>
                Arama kriterlerini değiştirip tekrar deneyin.
                </p>

            </div>

        `;

        return;

    }


    ilanlar.forEach(function(ilan){

        const card =
            document.createElement("article");

        card.className = "card";


        const favorite =
            isFavorite(ilan.id);

        const heart =
            favorite
            ? "❤️"
            : "♡";


        const active =
            favorite
            ? "active"
            : "";


        const image =
            getImage(ilan);


        const title =
            ilan.title || "İlan";


        const type =
            ilan.type || "Gayrimenkul";


        const city =
            ilan.city || "";


        const district =
            ilan.district || "";


        const rooms =
            ilan.rooms || "-";


        const area =
            ilan.area || "-";


        const price =
            Number(ilan.price || 0)
            .toLocaleString("tr-TR");


        card.innerHTML = `

            <div class="image-wrapper">

                <img
                    class="card-image"
                    src="${image}"
                    alt="${title}"
                    loading="lazy"
                >

                <span class="badge">
                    ${type}
                </span>

                <button
                    class="favorite ${active}"
                    onclick="toggleFavorite(${Number(ilan.id)})"
                    title="Favorilere ekle"
                >
                    ${heart}
                </button>

            </div>


            <div class="card-content">

                <h3>
                    ${title}
                </h3>


                <div class="location">
                    📍 ${city}
                    ${district ? " • " + district : ""}
                </div>


                <div class="details">

                    <span>🛏️ ${rooms}</span>

                    <span>📐 ${area} m²</span>

                    ${
                        ilan.buildingAge
                        ? `<span>🏢 ${ilan.buildingAge} yaş</span>`
                        : ""
                    }

                </div>


                <div class="price">
                    ${price} TL
                </div>


                <a
                    class="detail-button"
                    href="ilan.html?id=${Number(ilan.id)}"
                >
                    İlanı İncele →
                </a>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================
   FAVORİLERİ GÖSTER
===================================== */

function displayFavorites(){

    const container =
        document.getElementById(
            "favoriteListings"
        );


    const count =
        document.getElementById(
            "favoriteCount"
        );


    if(!container) return;


    const favoriteListings =
        allListings.filter(
            ilan =>
            favorites.includes(
                Number(ilan.id)
            )
        );


    if(count){

        count.textContent =
            favoriteListings.length +
            " favori";

    }


    container.innerHTML = "";


    if(favoriteListings.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h3>
                    ❤️ Henüz favori ilanınız yok
                </h3>

                <p>
                    Beğendiğiniz ilanların
                    ❤️ butonuna basarak
                    favorilerinize ekleyebilirsiniz.
                </p>

            </div>

        `;

        return;

    }


    favoriteListings.forEach(function(ilan){

        const card =
            document.createElement("article");

        card.className = "card";


        const image =
            getImage(ilan);


        const price =
            Number(ilan.price || 0)
            .toLocaleString("tr-TR");


        card.innerHTML = `

            <div class="image-wrapper">

                <img
                    class="card-image"
                    src="${image}"
                    alt="${ilan.title || "İlan"}"
                    loading="lazy"
                >

                <span class="badge">
                    ${ilan.type || "Gayrimenkul"}
                </span>

                <button
                    class="favorite active"
                    onclick="toggleFavorite(${Number(ilan.id)})"
                >
                    ❤️
                </button>

            </div>


            <div class="card-content">

                <h3>
                    ${ilan.title || "İlan"}
                </h3>

                <div class="location">
                    📍 ${ilan.city || ""}
                    ${ilan.district ? " • " + ilan.district : ""}
                </div>

                <div class="details">

                    <span>
                        🛏️ ${ilan.rooms || "-"}
                    </span>

                    <span>
                        📐 ${ilan.area || "-"} m²
                    </span>

                </div>

                <div class="price">
                    ${price} TL
                </div>

                <a
                    class="detail-button"
                    href="ilan.html?id=${Number(ilan.id)}"
                >
                    İlanı İncele →
                </a>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================
   FİLTRE
===================================== */

function getCurrentFilteredListings(){

    const type =
        document.getElementById("type").value;

    const city =
        document.getElementById("city").value;

    const rooms =
        document.getElementById("rooms").value;


    const minPrice =
        Number(
            document.getElementById(
                "minPrice"
            ).value
        ) || 0;


    const maxInput =
        document.getElementById(
            "maxPrice"
        ).value;


    const maxPrice =
        maxInput === ""
        ? Infinity
        : Number(maxInput);


    return allListings.filter(
        function(ilan){

            const typeOK =
                !type ||
                ilan.type === type;


            const cityOK =
                !city ||
                ilan.city === city;


            const roomsOK =
                !rooms ||
                ilan.rooms === rooms;


            const price =
                Number(ilan.price) || 0;


            const priceOK =
                price >= minPrice &&
                price <= maxPrice;


            return (
                typeOK &&
                cityOK &&
                roomsOK &&
                priceOK
            );

        }
    );

}


/* =====================================
   ARAMA
===================================== */

function searchListings(){

    const filtered =
        getCurrentFilteredListings();

    displayListings(filtered);

    document
        .getElementById("ilanlar")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =====================================
   BAŞLAT
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadListings();

    }
);

</script>

</body>
</html>
