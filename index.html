<script>

let allListings = [];

let favorites = JSON.parse(
    localStorage.getItem("novaFavorites") || "[]"
);


/* =========================
   FAVORİLERİ KAYDET
========================= */

function saveFavorites() {
    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );
}


/* =========================
   FAVORİ KONTROL
========================= */

function isFavorite(id) {
    return favorites.includes(Number(id));
}


/* =========================
   FAVORİ AÇ / KAPAT
========================= */

function toggleFavorite(id) {

    id = Number(id);

    if (favorites.includes(id)) {

        favorites = favorites.filter(
            favoriteId => favoriteId !== id
        );

    } else {

        favorites.push(id);

    }

    saveFavorites();

    displayListings(
        getCurrentFilteredListings()
    );

    displayFavorites();
}


/* =========================
   İLANLARI GETİR
========================= */

async function loadListings() {

    const result = document.getElementById("result");
    const container = document.getElementById("listings");

    try {

        result.textContent = "İlanlar yükleniyor...";

        const response = await fetch(
            "/api/ilanlar",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "API Hatası: " + response.status
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "API bir ilan listesi döndürmedi."
            );
        }

        allListings = data;

        displayListings(allListings);

        displayFavorites();

    } catch (error) {

        console.error(
            "İlan yükleme hatası:",
            error
        );

        result.textContent =
            "İlanlar yüklenemedi.";

        container.innerHTML = `
            <div class="empty">
                <h2>⚠️ İlanlar yüklenemedi</h2>
                <p>Sayfayı yenileyip tekrar deneyin.</p>
            </div>
        `;
    }
}


/* =========================
   İLANLARI GÖSTER
========================= */

function displayListings(ilanlar) {

    const container =
        document.getElementById("listings");

    const result =
        document.getElementById("result");

    container.innerHTML = "";

    result.textContent =
        ilanlar.length + " ilan bulundu.";


    if (ilanlar.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>😔 İlan bulunamadı</h2>
                <p>
                    Arama kriterlerini değiştirip tekrar deneyin.
                </p>
            </div>
        `;

        return;
    }


    ilanlar.forEach(function(ilan) {

        const card =
            document.createElement("div");

        card.className = "card";


        const favoriteActive =
            isFavorite(ilan.id);

        const heart =
            favoriteActive
                ? "❤️"
                : "♡";


        /* FOTOĞRAF */

        const image =
            ilan.image ||
            (
                Array.isArray(ilan.images)
                    ? ilan.images[0]
                    : ""
            ) ||
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80";


        card.innerHTML = `

            <button
                class="favorite ${favoriteActive ? "active" : ""}"
                onclick="toggleFavorite(${Number(ilan.id)})"
                title="Favorilere ekle"
            >
                ${heart}
            </button>

            <img
                src="${image}"
                alt="${ilan.title || "İlan"}"
                onerror="this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80'"
            >

            <div class="card-content">

                <span class="badge">
                    ${ilan.type || ""}
                </span>

                <h3>
                    ${ilan.title || "İlan"}
                </h3>

                <div class="details">

                    📍 ${ilan.city || ""}

                    ${
                        ilan.district
                            ? " / " + ilan.district
                            : ""
                    }

                    <br>

                    🛏️ ${ilan.rooms || "-"}

                    &nbsp; • &nbsp;

                    📐 ${ilan.area || 0} m²

                </div>

                <div class="price">

                    ${Number(ilan.price || 0)
                        .toLocaleString("tr-TR")} TL

                </div>

                <a
                    class="detail-button"
                    href="ilan.html?id=${encodeURIComponent(ilan.id)}"
                >
                    İlanı İncele →
                </a>

            </div>
        `;


        container.appendChild(card);

    });
}


/* =========================
   FAVORİLERİ GÖSTER
========================= */

function displayFavorites() {

    const container =
        document.getElementById(
            "favoriteListings"
        );

    const count =
        document.getElementById(
            "favoriteCount"
        );


    if (!container || !count) {
        return;
    }


    const favoriteListings =
        allListings.filter(function(ilan) {

            return favorites.includes(
                Number(ilan.id)
            );

        });


    count.textContent =
        favoriteListings.length + " favori";


    container.innerHTML = "";


    if (favoriteListings.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ❤️ Henüz favori ilanınız yok
                </h2>

                <p>
                    Beğendiğiniz ilanların üzerindeki
                    ❤️ butonuna basarak favorilerinize
                    ekleyebilirsiniz.
                </p>

                <button
                    onclick="
                        document
                        .getElementById('ilanlar')
                        .scrollIntoView({
                            behavior:'smooth'
                        })
                    "
                >
                    İlanlara Göz At
                </button>

            </div>

        `;

        return;
    }


    favoriteListings.forEach(function(ilan) {

        const card =
            document.createElement("div");

        card.className = "card";


        const image =
            ilan.image ||
            (
                Array.isArray(ilan.images)
                    ? ilan.images[0]
                    : ""
            );


        card.innerHTML = `

            <button
                class="favorite active"
                onclick="toggleFavorite(${Number(ilan.id)})"
                title="Favorilerden çıkar"
            >
                ❤️
            </button>

            <img
                src="${image}"
                alt="${ilan.title || "İlan"}"
            >

            <div class="card-content">

                <span class="badge">
                    ${ilan.type || ""}
                </span>

                <h3>
                    ${ilan.title || "İlan"}
                </h3>

                <div class="details">

                    📍 ${ilan.city || ""}

                    ${
                        ilan.district
                            ? " / " + ilan.district
                            : ""
                    }

                    <br>

                    🛏️ ${ilan.rooms || "-"}

                    &nbsp; • &nbsp;

                    📐 ${ilan.area || 0} m²

                </div>

                <div class="price">

                    ${Number(ilan.price || 0)
                        .toLocaleString("tr-TR")} TL

                </div>

                <a
                    class="detail-button"
                    href="ilan.html?id=${encodeURIComponent(ilan.id)}"
                >
                    İlanı İncele →
                </a>

            </div>
        `;


        container.appendChild(card);

    });
}


/* =========================
   FİLTRE
========================= */

function getCurrentFilteredListings() {

    const type =
        document.getElementById("type").value;

    const city =
        document.getElementById("city").value;

    const rooms =
        document.getElementById("rooms").value;

    const minPrice =
        Number(
            document.getElementById("minPrice").value
        ) || 0;

    const maxPriceValue =
        Number(
            document.getElementById("maxPrice").value
        );

    const maxPrice =
        maxPriceValue > 0
            ? maxPriceValue
            : Infinity;


    return allListings.filter(function(ilan) {

        const typeOK =
            !type ||
            ilan.type === type;

        const cityOK =
            !city ||
            ilan.city === city;

        const roomsOK =
            !rooms ||
            ilan.rooms === rooms;

        const price =
            Number(ilan.price) || 0;

        const priceOK =
            price >= minPrice &&
            price <= maxPrice;


        return (
            typeOK &&
            cityOK &&
            roomsOK &&
            priceOK
        );

    });
}


/* =========================
   ARAMA
========================= */

function searchListings() {

    const filtered =
        getCurrentFilteredListings();

    displayListings(filtered);
}


/* =========================
   BAŞLAT
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadListings();

    }
);

</script>
