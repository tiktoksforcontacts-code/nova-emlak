<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak | Hayalinizdeki Evi Bulun</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#1f2937;
}

/* =========================
   HEADER
========================= */

header{
    background:#111827;
    color:white;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.logo{
    font-size:24px;
    font-weight:800;
    text-decoration:none;
    color:white;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:15px;
    transition:.2s;
}

nav a:hover{
    color:#60a5fa;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:470px;

    background:
    linear-gradient(
        rgba(0,0,0,.58),
        rgba(0,0,0,.58)
    ),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=85");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    color:white;

    padding:80px 20px;
}

.hero-content{
    max-width:800px;
}

.hero h1{
    font-size:52px;
    margin:0 0 18px;
    line-height:1.1;
}

.hero p{
    font-size:19px;
    margin:0;
    color:#e5e7eb;
}

/* =========================
   SEARCH
========================= */

.search-box{
    max-width:1150px;
    margin:-55px auto 50px;
    background:white;
    border-radius:18px;
    padding:28px;
    position:relative;
    z-index:5;
    box-shadow:0 12px 40px rgba(0,0,0,.14);
}

.search-title{
    margin:0 0 20px;
    font-size:22px;
}

.filters{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(170px,1fr));
    gap:14px;
}

.filters select,
.filters input{
    width:100%;
    padding:14px;
    border:1px solid #dbe0e6;
    border-radius:10px;
    background:white;
    font-size:15px;
    outline:none;
}

.filters select:focus,
.filters input:focus{
    border-color:#2563eb;
}

.search-button{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.search-button:hover{
    background:#1d4ed8;
    transform:translateY(-1px);
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-header h2{
    margin:0;
    font-size:28px;
}

.result{
    color:#6b7280;
    margin-bottom:25px;
}

/* =========================
   CARDS
========================= */

.listings{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
    transition:.25s;
    position:relative;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 14px 35px rgba(0,0,0,.14);
}

.image-wrapper{
    height:225px;
    position:relative;
    background:#e5e7eb;
    overflow:hidden;
}

.image-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.favorite{
    position:absolute;
    right:13px;
    top:13px;

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:white;

    font-size:23px;
    cursor:pointer;

    box-shadow:0 3px 12px rgba(0,0,0,.2);

    z-index:3;
}

.favorite.active{
    color:#ef4444;
}

.photo-count{
    position:absolute;
    left:13px;
    bottom:13px;

    background:rgba(0,0,0,.65);
    color:white;

    padding:7px 10px;
    border-radius:7px;

    font-size:13px;
}

.card-content{
    padding:20px;
}

.badge{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:6px 10px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.card h3{
    font-size:20px;
    margin:12px 0 10px;
    line-height:1.35;
}

.details{
    color:#6b7280;
    font-size:14px;
    line-height:1.8;
    margin-bottom:12px;
}

.price{
    color:#2563eb;
    font-size:22px;
    font-weight:800;
    margin-bottom:16px;
}

.detail-button{
    display:block;
    text-align:center;

    background:#111827;
    color:white;

    padding:12px;

    border-radius:9px;

    text-decoration:none;
    font-weight:bold;

    transition:.2s;
}

.detail-button:hover{
    background:#2563eb;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    background:white;
    padding:55px 20px;
    border-radius:16px;
    text-align:center;
    color:#6b7280;
}

.empty h2{
    color:#374151;
    margin-top:0;
}

.empty button{
    border:0;
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   FAVORITES
========================= */

.favorites-section{
    margin-top:75px;
    margin-bottom:60px;
}

.favorite-count{
    color:#6b7280;
}

/* =========================
   LOADING
========================= */

.loading{
    grid-column:1/-1;
    background:white;
    padding:50px;
    text-align:center;
    border-radius:15px;
    color:#6b7280;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#111827;
    color:white;
    margin-top:80px;
    padding:45px 20px;
    text-align:center;
}

footer h3{
    margin:0 0 15px;
    font-size:22px;
}

footer p{
    margin:8px;
    color:#d1d5db;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:16px 20px;
        flex-direction:column;
        gap:14px;
    }

    nav{
        gap:14px;
        flex-wrap:wrap;
        justify-content:center;
    }

    nav a{
        font-size:14px;
    }

    .hero{
        min-height:390px;
        padding:60px 20px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:16px;
    }

    .search-box{
        margin:20px;
        padding:20px;
    }

    .section-header{
        align-items:flex-start;
    }

    .section-header h2{
        font-size:24px;
    }

    .listings{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<a href="index.html" class="logo">
🏠 NOVA EMLAK
</a>

<nav>

<a href="index.html">
Ana Sayfa
</a>

<a href="#ilanlar">
İlanlar
</a>

<a href="#favoriler">
❤️ Favoriler
</a>

<a href="#iletisim">
İletişim
</a>

</nav>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

<div class="hero-content">

<h1>
Hayalinizdeki Evi Bulun
</h1>

<p>
Satılık ve kiralık gayrimenkulleri kolayca keşfedin.
</p>

</div>

</section>


<!-- =========================
     SEARCH
========================= -->

<div class="search-box">

<h2 class="search-title">
🔎 İlan Ara
</h2>

<div class="filters">

<select id="type">

<option value="">
Satılık + Kiralık
</option>

<option value="Satılık">
Satılık
</option>

<option value="Kiralık">
Kiralık
</option>

</select>


<select id="city">

<option value="">
Tüm şehirler
</option>

<option value="İstanbul">
İstanbul
</option>

<option value="Ankara">
Ankara
</option>

<option value="İzmir">
İzmir
</option>

</select>


<select id="rooms">

<option value="">
Tüm oda sayıları
</option>

<option value="1+1">
1+1
</option>

<option value="2+1">
2+1
</option>

<option value="3+1">
3+1
</option>

<option value="4+1">
4+1
</option>

<option value="5+1">
5+1
</option>

</select>


<input
    id="minPrice"
    type="number"
    placeholder="Min. fiyat TL"
>


<input
    id="maxPrice"
    type="number"
    placeholder="Max. fiyat TL"
>

</div>


<button
    class="search-button"
    onclick="searchListings()"
>
🔎 İlanları Ara
</button>

</div>


<!-- =========================
     MAIN
========================= -->

<main
    class="container"
    id="ilanlar"
>

<div class="section-header">

<h2>
🏡 Güncel İlanlar
</h2>

</div>


<div
    class="result"
    id="result"
>
İlanlar yükleniyor...
</div>


<div
    class="listings"
    id="listings"
>

<div class="loading">
⏳ İlanlar yükleniyor...
</div>

</div>


<!-- =========================
     FAVORİLER
========================= -->

<section
    class="favorites-section"
    id="favoriler"
>

<div class="section-header">

<h2>
❤️ Favorilerim
</h2>

<span
    class="favorite-count"
    id="favoriteCount"
>
0 favori
</span>

</div>


<div
    class="listings"
    id="favoriteListings"
>
</div>

</section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer id="iletisim">

<h3>
🏠 Nova Emlak
</h3>

<p>
📞 0555 555 55 55
</p>

<p>
📍 İstanbul
</p>

<p>
© 2026 Nova Emlak
</p>

</footer>


<script>

/* =========================
   DEĞİŞKENLER
========================= */

let allListings = [];

let favorites = [];


/* =========================
   FAVORİLERİ YÜKLE
========================= */

try{

    favorites =
        JSON.parse(
            localStorage.getItem(
                "novaFavorites"
            ) || "[]"
        );

    if(!Array.isArray(favorites)){
        favorites = [];
    }

}catch(error){

    favorites = [];

}


/* =========================
   FAVORİLERİ KAYDET
========================= */

function saveFavorites(){

    try{

        localStorage.setItem(
            "novaFavorites",
            JSON.stringify(favorites)
        );

    }catch(error){

        console.error(
            "Favoriler kaydedilemedi:",
            error
        );

    }

}


/* =========================
   FAVORİ KONTROL
========================= */

function isFavorite(id){

    return favorites.includes(
        Number(id)
    );

}


/* =========================
   FAVORİ AÇ/KAPAT
========================= */

function toggleFavorite(id){

    id = Number(id);

    if(isFavorite(id)){

        favorites =
            favorites.filter(
                favoriteId =>
                    favoriteId !== id
            );

    }else{

        favorites.push(id);

    }

    saveFavorites();

    displayListings(
        getCurrentFilteredListings()
    );

    displayFavorites();

}


/* =========================
   API'DEN İLANLARI GETİR
========================= */

async function loadListings(){

    const result =
        document.getElementById("result");

    const container =
        document.getElementById("listings");


    try{

        const response =
            await fetch(
                "/api/ilanlar",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "API dizi döndürmedi."
            );

        }


        allListings = data;


        displayListings(
            allListings
        );

        displayFavorites();


    }catch(error){

        console.error(
            "İlan yükleme hatası:",
            error
        );


        if(result){

            result.textContent =
                "İlanlar yüklenemedi.";

        }


        if(container){

            container.innerHTML = `

                <div class="empty">

                    <h2>
                    ⚠️ İlanlar yüklenemedi
                    </h2>

                    <p>
                    Sunucu bağlantısını kontrol edin.
                    </p>

                    <button
                    onclick="loadListings()"
                    >
                    Tekrar Dene
                    </button>

                </div>

            `;

        }

    }

}


/* =========================
   GÖRSEL URL
========================= */

function getMainImage(ilan){

    if(
        Array.isArray(ilan.images) &&
        ilan.images.length > 0 &&
        ilan.images[0]
    ){

        return ilan.images[0];

    }


    if(ilan.image){

        return ilan.image;

    }


    return "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80";

}


/* =========================
   FOTOĞRAF SAYISI
========================= */

function getPhotoCount(ilan){

    if(
        Array.isArray(ilan.images) &&
        ilan.images.length
    ){

        return ilan.images.length;

    }

    if(ilan.image){

        return 1;

    }

    return 0;

}


/* =========================
   İLANLARI GÖSTER
========================= */

function displayListings(ilanlar){

    const container =
        document.getElementById(
            "listings"
        );

    const result =
        document.getElementById(
            "result"
        );


    if(!container){

        console.error(
            "listings elementi bulunamadı."
        );

        return;

    }


    container.innerHTML = "";


    if(!Array.isArray(ilanlar)){

        ilanlar = [];

    }


    if(result){

        result.textContent =
            ilanlar.length +
            " ilan bulundu.";

    }


    if(ilanlar.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h2>
                😔 İlan bulunamadı
                </h2>

                <p>
                Arama kriterlerini değiştirip
                tekrar deneyin.
                </p>

            </div>

        `;

        return;

    }


    ilanlar.forEach(function(ilan){

        const card =
            document.createElement(
                "div"
            );

        card.className = "card";


        const favorite =
            isFavorite(ilan.id);


        const heart =
            favorite
            ? "❤️"
            : "♡";


        const photoCount =
            getPhotoCount(ilan);


        const image =
            getMainImage(ilan);


        card.innerHTML = `

            <div class="image-wrapper">

                <button
                    class="favorite ${favorite ? "active" : ""}"
                    onclick="toggleFavorite(${Number(ilan.id)})"
                    title="Favorilere ekle"
                >
                    ${heart}
                </button>


                <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(ilan.title || "Nova Emlak ilanı")}"
                    loading="lazy"
                    onerror="this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80'"
                >


                ${
                    photoCount > 1
                    ? `
                    <div class="photo-count">
                        📷 ${photoCount} fotoğraf
                    </div>
                    `
                    : ""
                }

            </div>


            <div class="card-content">

                <span class="badge">
                    ${escapeHTML(ilan.type || "İlan")}
                </span>


                <h3>
                    ${escapeHTML(
                        ilan.title ||
                        "İlan başlığı"
                    )}
                </h3>


                <div class="details">

                    📍
                    ${escapeHTML(
                        ilan.city || ""
                    )}

                    ${
                        ilan.district
                        ? " / " +
                        escapeHTML(
                            ilan.district
                        )
                        : ""
                    }

                    <br>

                    🛏️
                    ${escapeHTML(
                        ilan.rooms || "-"
                    )}

                    &nbsp; • &nbsp;

                    📐
                    ${Number(
                        ilan.area || 0
                    ).toLocaleString("tr-TR")}

                    m²

                </div>


                <div class="price">

                    ${Number(
                        ilan.price || 0
                    ).toLocaleString("tr-TR")}

                    TL

                </div>


                <a
                    class="detail-button"
                    href="ilan.html?id=${encodeURIComponent(ilan.id)}"
                >
                    İlanı İncele →
                </a>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   FAVORİLERİ GÖSTER
========================= */

function displayFavorites(){

    const container =
        document.getElementById(
            "favoriteListings"
        );

    const count =
        document.getElementById(
            "favoriteCount"
        );


    if(!container){

        return;

    }


    const favoriteListings =
        allListings.filter(
            ilan =>
                isFavorite(ilan.id)
        );


    if(count){

        count.textContent =
            favoriteListings.length +
            " favori";

    }


    container.innerHTML = "";


    if(
        favoriteListings.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <h2>
                ❤️ Henüz favori ilanınız yok
                </h2>

                <p>
                Beğendiğiniz ilanların üzerindeki
                ❤️ butonuna basarak favorilerinize
                ekleyebilirsiniz.
                </p>

                <button
                    onclick="
                    document
                    .getElementById('ilanlar')
                    .scrollIntoView({
                        behavior:'smooth'
                    })
                    "
                >
                    İlanlara Göz At
                </button>

            </div>

        `;

        return;

    }


    favoriteListings.forEach(
        function(ilan){

            const card =
                document.createElement(
                    "div"
                );

            card.className = "card";


            const image =
                getMainImage(ilan);


            card.innerHTML = `

                <div class="image-wrapper">

                    <button
                        class="favorite active"
                        onclick="toggleFavorite(${Number(ilan.id)})"
                        title="Favorilerden çıkar"
                    >
                        ❤️
                    </button>


                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(ilan.title || "İlan")}"
                        loading="lazy"
                    >

                </div>


                <div class="card-content">

                    <span class="badge">
                        ${escapeHTML(
                            ilan.type || "İlan"
                        )}
                    </span>


                    <h3>
                        ${escapeHTML(
                            ilan.title ||
                            "İlan"
                        )}
                    </h3>


                    <div class="details">

                        📍
                        ${escapeHTML(
                            ilan.city || ""
                        )}

                        ${
                            ilan.district
                            ? " / " +
                            escapeHTML(
                                ilan.district
                            )
                            : ""
                        }

                        <br>

                        🛏️
                        ${escapeHTML(
                            ilan.rooms || "-"
                        )}

                        &nbsp; • &nbsp;

                        📐
                        ${Number(
                            ilan.area || 0
                        ).toLocaleString(
                            "tr-TR"
                        )}

                        m²

                    </div>


                    <div class="price">

                        ${Number(
                            ilan.price || 0
                        ).toLocaleString(
                            "tr-TR"
                        )}

                        TL

                    </div>


                    <a
                        class="detail-button"
                        href="ilan.html?id=${encodeURIComponent(ilan.id)}"
                    >
                        İlanı İncele →
                    </a>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =========================
   FİLTRE
========================= */

function getCurrentFilteredListings(){

    const typeElement =
        document.getElementById(
            "type"
        );

    const cityElement =
        document.getElementById(
            "city"
        );

    const roomsElement =
        document.getElementById(
            "rooms"
        );

    const minPriceElement =
        document.getElementById(
            "minPrice"
        );

    const maxPriceElement =
        document.getElementById(
            "maxPrice"
        );


    const type =
        typeElement
        ? typeElement.value
        : "";


    const city =
        cityElement
        ? cityElement.value
        : "";


    const rooms =
        roomsElement
        ? roomsElement.value
        : "";


    const minPrice =
        minPriceElement &&
        minPriceElement.value
        ? Number(
            minPriceElement.value
        )
        : 0;


    const maxPrice =
        maxPriceElement &&
        maxPriceElement.value
        ? Number(
            maxPriceElement.value
        )
        : Infinity;


    return allListings.filter(
        function(ilan){

            const typeOK =
                !type ||
                ilan.type === type;


            const cityOK =
                !city ||
                ilan.city === city;


            const roomsOK =
                !rooms ||
                ilan.rooms === rooms;


            const price =
                Number(
                    ilan.price || 0
                );


            const priceOK =
                price >= minPrice &&
                price <= maxPrice;


            return (
                typeOK &&
                cityOK &&
                roomsOK &&
                priceOK
            );

        }
    );

}


/* =========================
   ARAMA
========================= */

function searchListings(){

    displayListings(
        getCurrentFilteredListings()
    );


    const ilanlar =
        document.getElementById(
            "ilanlar"
        );


    if(ilanlar){

        ilanlar.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }

}


/* =========================
   HTML GÜVENLİĞİ
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   BAŞLAT
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadListings();

    }
);

</script>

</body>
</html>
