<script>

let adminToken =
    sessionStorage.getItem("novaAdminToken") || "";

let allListings = [];


/* =========================
GİRİŞ
========================= */

async function login(){

    const password =
        document.getElementById("password").value;

    try{

        const response =
            await fetch("/api/admin-login",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    password:password
                })
            });

        const data =
            await response.json();

        if(data.success){

            adminToken=data.token;

            sessionStorage.setItem(
                "novaAdminToken",
                adminToken
            );

            showAdmin();

        }else{

            document.getElementById(
                "loginError"
            ).style.display="block";

        }

    }catch(error){

        console.error(error);

        alert("Sunucu bağlantı hatası.");

    }
}


document.getElementById("password")
.addEventListener("keydown",function(event){

    if(event.key==="Enter"){
        login();
    }

});


/* =========================
ADMIN
========================= */

function showAdmin(){

    document.getElementById("loginScreen")
    .style.display="none";

    document.getElementById("adminPanel")
    .style.display="block";

    loadListings();

}


if(adminToken){

    showAdmin();

}


/* =========================
ÇIKIŞ
========================= */

async function logout(){

    try{

        await fetch("/api/admin-logout",{
            method:"POST",
            headers:{
                "Authorization":
                    "Bearer " + adminToken
            }
        });

    }catch(error){

        console.error(error);

    }

    sessionStorage.removeItem(
        "novaAdminToken"
    );

    adminToken="";

    location.reload();

}


/* =========================
FOTOĞRAF ÖNİZLEME
========================= */

document.getElementById("imageFile")
.addEventListener("change",function(){

    const files =
        Array.from(this.files);

    const preview =
        document.getElementById("photoPreview");

    preview.innerHTML="";

    if(files.length>4){

        alert("En fazla 4 fotoğraf seçebilirsin.");

        this.value="";

        return;

    }

    files.forEach(function(file){

        const reader =
            new FileReader();

        reader.onload=function(e){

            const img =
                document.createElement("img");

            img.src=e.target.result;

            preview.appendChild(img);

        };

        reader.readAsDataURL(file);

    });

});


/* =========================
BASE64
========================= */

function readFiles(files){

    return Promise.all(
        files.map(function(file){

            return new Promise(function(resolve,reject){

                const reader =
                    new FileReader();

                reader.onload=function(e){
                    resolve(e.target.result);
                };

                reader.onerror=reject;

                reader.readAsDataURL(file);

            });

        })
    );

}


/* =========================
YENİ İLAN
========================= */

document.getElementById("listingForm")
.addEventListener("submit",async function(event){

    event.preventDefault();

    const files =
        Array.from(
            document.getElementById("imageFile").files
        );

    if(files.length===0){

        alert("Lütfen fotoğraf seç.");

        return;

    }

    if(files.length>4){

        alert("En fazla 4 fotoğraf seçebilirsin.");

        return;

    }


    try{

        const images =
            await readFiles(files);


        const ilan={

            title:
                document.getElementById("title").value.trim(),

            type:
                document.getElementById("type").value,

            city:
                document.getElementById("city").value,

            district:
                document.getElementById("district").value.trim(),

            neighborhood:
                document.getElementById("neighborhood").value.trim(),

            price:
                Number(document.getElementById("price").value),

            rooms:
                document.getElementById("rooms").value.trim(),

            area:
                Number(document.getElementById("area").value),

            buildingAge:
                Number(document.getElementById("buildingAge").value) || 0,

            floor:
                document.getElementById("floor").value.trim(),

            totalFloors:
                Number(document.getElementById("totalFloors").value) || 0,

            heating:
                document.getElementById("heating").value,

            bathrooms:
                document.getElementById("bathrooms").value,

            balcony:
                document.getElementById("balcony").value,

            credit:
                document.getElementById("credit").value,

            deed:
                document.getElementById("deed").value,

            image:
                images[0],

            images:
                images,

            description:
                document.getElementById("description").value.trim()

        };


        const response =
            await fetch("/api/ilanlar",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":
                        "Bearer " + adminToken
                },

                body:
                    JSON.stringify(ilan)

            });


        if(response.status===401){

            alert(
                "Admin oturumunun süresi dolmuş. Tekrar giriş yap."
            );

            logout();

            return;

        }


        const data =
            await response.json();


        if(data.success){

            showMessage(
                "✅ İlan başarıyla kaydedildi!",
                true
            );

            document.getElementById(
                "listingForm"
            ).reset();

            document.getElementById(
                "photoPreview"
            ).innerHTML="";

            loadListings();

        }else{

            showMessage(
                "❌ " +
                (data.error || "İlan kaydedilemedi."),
                false
            );

        }

    }catch(error){

        console.error(error);

        showMessage(
            "❌ Sunucu bağlantı hatası.",
            false
        );

    }

});


/* =========================
MESAJ
========================= */

function showMessage(text,success){

    const message =
        document.getElementById("message");

    message.textContent=text;

    message.className =
        success
        ? "message success"
        : "message error";

    message.style.display="block";

    setTimeout(function(){

        message.style.display="none";

    },4000);

}


/* =========================
İLANLARI GETİR
========================= */

async function loadListings(){

    try{

        const response =
            await fetch("/api/ilanlar",{
                cache:"no-store"
            });

        if(!response.ok){

            throw new Error("İlanlar alınamadı.");

        }

        const ilanlar =
            await response.json();

        if(!Array.isArray(ilanlar)){

            throw new Error("Geçersiz ilan verisi.");

        }

        allListings=ilanlar;

        updateStats();

        filterListings();

    }catch(error){

        console.error(error);

        document.getElementById("count")
        .textContent =
            "İlanlar yüklenemedi.";

    }

}


/* =========================
İSTATİSTİKLER
========================= */

function updateStats(){

    const total =
        allListings.length;

    const sale =
        allListings.filter(
            x=>x.type==="Satılık"
        ).length;

    const rent =
        allListings.filter(
            x=>x.type==="Kiralık"
        ).length;

    const prices =
        allListings
        .map(x=>Number(x.price)||0)
        .filter(x=>x>0);

    const average =
        prices.length
        ?
        Math.round(
            prices.reduce(
                (a,b)=>a+b,
                0
            ) / prices.length
        )
        :
        0;

    document.getElementById("totalCount")
    .textContent=total;

    document.getElementById("saleCount")
    .textContent=sale;

    document.getElementById("rentCount")
    .textContent=rent;

    document.getElementById("averagePrice")
    .textContent=
        average.toLocaleString("tr-TR") + " TL";

}


/* =========================
ARAMA / FİLTRE
========================= */

function filterListings(){

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const type =
        document.getElementById("typeFilter")
        .value;

    const sort =
        document.getElementById("sortFilter")
        .value;


    let filtered =
        allListings.filter(function(ilan){

            const text =
                (
                    (ilan.title || "") +
                    " " +
                    (ilan.city || "") +
                    " " +
                    (ilan.district || "") +
                    " " +
                    (ilan.neighborhood || "") +
                    " " +
                    (ilan.rooms || "")
                )
                .toLowerCase();

            const searchMatch =
                !search ||
                text.includes(search);

            const typeMatch =
                !type ||
                ilan.type===type;

            return searchMatch && typeMatch;

        });


    filtered.sort(function(a,b){

        if(sort==="new"){
            return Number(b.id)-Number(a.id);
        }

        if(sort==="old"){
            return Number(a.id)-Number(b.id);
        }

        if(sort==="priceHigh"){
            return Number(b.price||0)-Number(a.price||0);
        }

        if(sort==="priceLow"){
            return Number(a.price||0)-Number(b.price||0);
        }

        return 0;

    });


    renderListings(filtered);

}


/* =========================
İLANLARI GÖSTER
========================= */

function renderListings(ilanlar){

    const container =
        document.getElementById("listings");

    container.innerHTML="";


    document.getElementById("count")
    .textContent =
        ilanlar.length +
        " ilan gösteriliyor";


    if(ilanlar.length===0){

        container.innerHTML =
            '<p class="empty">🔎 İlan bulunamadı.</p>';

        return;

    }


    ilanlar.forEach(function(ilan){

        const item =
            document.createElement("div");

        item.className="listing";


        const top =
            document.createElement("div");

        top.className="listing-top";


        const main =
            document.createElement("div");

        main.className="listing-main";


        const images =
            Array.isArray(ilan.images)
            ? ilan.images
            : (ilan.image ? [ilan.image] : []);


        if(images.length){

            const image =
                document.createElement("img");

            image.src=images[0];

            image.alt=ilan.title || "İlan";

            image.onerror=function(){
                this.style.display="none";
            };

            top.appendChild(image);

        }


        const content =
            document.createElement("div");

        content.className="listing-main";


        const title =
            document.createElement("h3");

        title.textContent =
            ilan.title || "İsimsiz ilan";

        content.appendChild(title);


        const info =
            document.createElement("div");

        info.className="info";

        info.textContent =
            (ilan.type || "") +
            " • " +
            (ilan.city || "") +
            " / " +
            (ilan.district || "") +
            " • " +
            (ilan.rooms || "") +
            " • " +
            (ilan.area || 0) +
            " m²";

        content.appendChild(info);


        const extra =
            document.createElement("div");

        extra.className="info";

        extra.textContent =
            "🏢 " +
            (ilan.buildingAge || 0) +
            " yaş • Kat: " +
            (ilan.floor || "-") +
            " • 🔥 " +
            (ilan.heating || "-");

        content.appendChild(extra);


        const price =
            document.createElement("div");

        price.className="price";

        price.textContent =
            Number(ilan.price || 0)
            .toLocaleString("tr-TR") +
            " TL";

        content.appendChild(price);


        const actions =
            document.createElement("div");

        actions.className="actions";


        const viewButton =
            document.createElement("button");

        viewButton.className="view-button";

        viewButton.textContent="👁️ Görüntüle";

        viewButton.onclick=function(){

            window.open(
                "ilan.html?id=" +
                encodeURIComponent(ilan.id),
                "_blank"
            );

        };

        actions.appendChild(viewButton);


        const editButton =
            document.createElement("button");

        editButton.className="edit-button";

        editButton.textContent="✏️ Düzenle";

        editButton.onclick=function(){

            openEdit(ilan.id);

        };

        actions.appendChild(editButton);


        const deleteButton =
            document.createElement("button");

        deleteButton.className="delete-button";

        deleteButton.textContent="🗑️ Sil";

        deleteButton.onclick=function(){

            deleteListing(ilan.id);

        };

        actions.appendChild(deleteButton);


        content.appendChild(actions);

        top.appendChild(content);

        item.appendChild(top);

        container.appendChild(item);

    });

}

document.getElementById("editImageFile")
.addEventListener("change",function(){

    const files =
        Array.from(this.files);

    const preview =
        document.getElementById(
            "editPhotoPreview"
        );

    preview.innerHTML="";


    if(files.length>4){

        alert(
            "En fazla 4 fotoğraf seçebilirsin."
        );

        this.value="";

        return;

    }


    files.forEach(function(file){

        const reader =
            new FileReader();

        reader.onload=function(e){

            const img =
                document.createElement("img");

            img.src=e.target.result;

            preview.appendChild(img);

        };

        reader.readAsDataURL(file);

    });

});

async function saveEdit(){

    const mevcut =
        allListings.find(
            x=>String(x.id)===String(id)
        );


    if(!mevcut){

    try{

            );

            if(files.length>4){

                alert(
                    "En fazla 4 fotoğraf seçebilirsin."
                );

                return;

            }

            images =
                await readFiles(files);

        }else{

            images =
                Array.isArray(mevcut.images)
                ? mevcut.images
                : (mevcut.image
                    ? [mevcut.image]
                    : []);

        }

async function sendUpdate(id,images){

    const updated={

        title:
            document.getElementById("editTitle").value.trim(),

        type:
            document.getElementById("editType").value,

        city:
            document.getElementById("editCity").value,

        district:
            document.getElementById("editDistrict").value.trim(),

        neighborhood:
            document.getElementById("editNeighborhood").value.trim(),

        price:
            Number(document.getElementById("editPrice").value),

        rooms:
            document.getElementById("editRooms").value.trim(),

        area:
            Number(document.getElementById("editArea").value),

        buildingAge:
            Number(document.getElementById("editBuildingAge").value)||0,

        floor:
            document.getElementById("editFloor").value.trim(),

        totalFloors:
            Number(document.getElementById("editTotalFloors").value)||0,

        heating:
            document.getElementById("editHeating").value,

        bathrooms:
            document.getElementById("editBathrooms").value,

        balcony:
            document.getElementById("editBalcony").value,

        credit:
            document.getElementById("editCredit").value,

        deed:
            document.getElementById("editDeed").value,

        image:
            images[0] || "",

        images:
            images,

        description:
            document.getElementById("editDescription").value.trim()

    };


    try{

        const response =
            await fetch(
                "/api/ilanlar/" + id,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + adminToken
                    },

                    body:
                        JSON.stringify(updated)
                }
            );


        if(response.status===401){

            alert(
                "Admin oturumunun süresi dolmuş."
            );

            logout();

            return;

        }


        const data =
            await response.json();


        if(data.success){

            alert(
                "✅ İlan başarıyla güncellendi!"
            );

            closeModal();

            loadListings();

        }else{

            alert(
                "❌ " +
                (data.error ||
                "İlan güncellenemedi.")
            );

        }


    }catch(error){

        console.error(error);

        alert("❌ Sunucu bağlantı hatası.");

    }

}

        );
