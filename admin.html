<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Emlak - Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#1f2937;
}

header{
    background:#111827;
    color:white;
    padding:22px 7%;
}

header h1{margin:0}

.container{
    max-width:1000px;
    margin:35px auto;
    padding:0 20px;
}

.panel{
    background:white;
    padding:28px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{opacity:.9}

.add-button{
    width:100%;
    margin-top:22px;
    background:#2563eb;
    color:white;
    padding:15px;
    font-size:16px;
}

.edit-button{
    background:#2563eb;
    color:white;
    margin-right:8px;
}

.delete-button{
    background:#dc2626;
    color:white;
}

.cancel-button{
    background:#6b7280;
    color:white;
    margin-left:8px;
}

.logout{
    float:right;
    background:#dc2626;
    color:white;
}

.back{
    color:#2563eb;
    text-decoration:none;
}

.preview{
    display:none;
    width:100%;
    max-width:450px;
    height:250px;
    object-fit:cover;
    margin-top:15px;
    border-radius:10px;
}

.listing{
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
}

.listing img{
    width:180px;
    height:110px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:12px;
}

.listing h3{
    margin:0 0 8px;
}

.info{
    color:#6b7280;
    margin-bottom:8px;
    line-height:1.7;
}

.price{
    color:#2563eb;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.message{
    display:none;
    padding:14px;
    border-radius:8px;
    margin-top:15px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:rgba(0,0,0,.55);
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:700px;
    margin:40px auto;
    padding:28px;
    border-radius:15px;
}

.modal-box h2{margin-top:0}

.login-box{
    max-width:420px;
    margin:100px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.login-button{
    width:100%;
    margin-top:15px;
    background:#2563eb;
    color:white;
}

.login-error{
    display:none;
    color:#dc2626;
    text-align:center;
}

.empty{
    color:#777;
    padding:15px 0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.grid > div{
    min-width:0;
}

.section{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #eee;
}

@media(max-width:600px){
    .panel{padding:20px}
    .listing img{
        width:100%;
        height:200px;
    }
    .edit-button,
    .delete-button{
        margin-top:8px;
    }
    header{padding:20px}
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- ========================= -->
<!-- GİRİŞ -->
<!-- ========================= -->

<div id="loginScreen" class="login-box">

    <h2 style="text-align:center">🔐 Admin Girişi</h2>

    <p style="text-align:center;color:#666">
        Nova Emlak Yönetim Paneli
    </p>

    <input
        id="password"
        type="password"
        placeholder="Admin şifresi"
        autocomplete="current-password"
    >

    <button
        onclick="login()"
        class="login-button"
    >
        Giriş Yap
    </button>

    <p id="loginError" class="login-error">
        ❌ Şifre yanlış.
    </p>

</div>


<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- ========================= -->

<div id="adminPanel" style="display:none">

<header>

    <button
        class="logout"
        onclick="logout()"
    >
        Çıkış
    </button>

    <h1>🏠 NOVA EMLAK — ADMIN</h1>

</header>


<div class="container">


<!-- ========================= -->
<!-- YENİ İLAN -->
<!-- ========================= -->

<div class="panel">

<h2>➕ Yeni İlan Ekle</h2>

<form id="listingForm">

<label>İlan Başlığı</label>

<input

>


<div class="grid">

<div>

    <option value="Kiralık">Kiralık</option>
</select>
</div>

<div>
<label>Şehir</label>

<select id="city">
    <option value="İstanbul">İstanbul</option>
    <option value="Ankara">Ankara</option>
    <option value="İzmir">İzmir</option>
</select>
</div>

</div>


<div class="grid">

<div>
<label>İlçe</label>

<input
    id="district"
    type="text"

    required
>
</div>

<div>
<label>Mahalle</label>

<input
    id="neighborhood"
    type="text"
    placeholder="Örn: Fenerbahçe Mahallesi"
>
</div>

</div>


<div class="grid">

<div>
<label>Fiyat</label>

<input

    type="number"

    placeholder="8500000"
    required
>
</div>

<div>
<label>Oda Sayısı</label>

<input
    id="rooms"

    required
>
</div>

</div>


<div class="grid">

<div>
<label>Metrekare</label>

<input
    id="area"
    type="number"
    min="0"
    placeholder="145"
    required
>
</div>

<div>
<label>Bina Yaşı</label>

<input
    id="buildingAge"
    type="number"
    min="0"
    placeholder="5"
>
</div>

</div>


<div class="grid">

<div>
<label>Bulunduğu Kat</label>

<input
    id="floor"
    type="text"
    placeholder="3. Kat"
>
</div>

<div>
<label>Toplam Kat</label>

<input
    id="totalFloors"
    type="number"
    min="0"
    placeholder="8"
>
</div>

</div>


<div class="grid">

<div>
<label>Isıtma</label>

<select id="heating">
    <option value="">Seçiniz</option>
    <option value="Doğalgaz Kombi">Doğalgaz Kombi</option>
    <option value="Merkezi Sistem">Merkezi Sistem</option>
    <option value="Yerden Isıtma">Yerden Isıtma</option>
    <option value="Klima">Klima</option>
    <option value="Diğer">Diğer</option>
</select>
</div>

<div>
<label>Banyo Sayısı</label>

<select id="bathrooms">
    <option value="">Seçiniz</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4+">4+</option>
</select>
</div>

</div>


<div class="grid">

<div>
<label>Balkon</label>

<select id="balcony">
    <option value="Var">Var</option>
    <option value="Yok">Yok</option>
</select>
</div>

<div>
<label>Krediye Uygun</label>

<select id="credit">
    <option value="Evet">Evet</option>
    <option value="Hayır">Hayır</option>
</select>
</div>

</div>


<label>Tapu Durumu</label>

<select id="deed">
    <option value="">Seçiniz</option>
    <option value="Kat Mülkiyeti">Kat Mülkiyeti</option>
    <option value="Kat İrtifakı">Kat İrtifakı</option>
    <option value="Arsa Tapulu">Arsa Tapulu</option>
    <option value="Hisseli Tapu">Hisseli Tapu</option>
</select>


<label>📷 Fotoğraf</label>

<input
    id="imageFile"
    type="file"
    accept="image/*"
    required
>

<img
    id="preview"
    class="preview"
>


<label>Açıklama</label>

<textarea
    id="description"
    placeholder="İlan hakkında detaylı açıklama..."
    required
></textarea>


<button
    class="add-button"
    type="submit"
>
    🚀 İlanı Kaydet
</button>


<div
    id="message"
    class="message"
></div>

</form>

</div>


<!-- ========================= -->
<!-- İLAN YÖNETİMİ -->
<!-- ========================= -->

<div class="panel">

<h2>📋 İlan Yönetimi</h2>

<p id="count">
    İlanlar yükleniyor...
</p>

<div id="listings"></div>

</div>


<a
    class="back"
    href="index.html"
>
    ← Ana sayfaya dön
</a>

</div>
</div>


<!-- ========================= -->
<!-- DÜZENLEME MODALI -->
<!-- ========================= -->

<div id="editModal" class="modal">

<div class="modal-box">

<h2>✏️ İlanı Düzenle</h2>

<input type="hidden" id="editId">


<label>İlan Başlığı</label>
<input id="editTitle" type="text">


<div class="grid">

<div>
<label>İlan Türü</label>
<select id="editType">
    <option value="Satılık">Satılık</option>
    <option value="Kiralık">Kiralık</option>
</select>
</div>

<div>
<label>Şehir</label>
<select id="editCity">
    <option value="İstanbul">İstanbul</option>
    <option value="Ankara">Ankara</option>
    <option value="İzmir">İzmir</option>
</select>
</div>

</div>


<div class="grid">

<div>
<label>İlçe</label>
<input id="editDistrict" type="text">
</div>

<div>
<label>Mahalle</label>

</div>

</div>


<div class="grid">

<div>

<input id="editPrice" type="number">
</div>

<input id="editRooms" type="text">
</div>

</div>

</div>

</div>

</select>

>

<script>

/* =========================
   ADMIN TOKEN
========================= */

let adminToken =
    sessionStorage.getItem("novaAdminToken") || "";


/* =========================
   GİRİŞ
========================= */

async function login(){

    const password =
        document.getElementById("password").value;

    try{

        const response =
            await fetch("/api/admin-login",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    password:password
                })
            });

        const data =
            await response.json();

        if(data.success){

            adminToken = data.token;

            sessionStorage.setItem(
                "novaAdminToken",
                adminToken
            );

            showAdmin();

        }else{

            document.getElementById(
                "loginError"
            ).style.display="block";

        }

    }catch(error){

        console.error(error);

        alert("Sunucu bağlantı hatası.");

    }
}


/* ENTER */

document.getElementById("password")
.addEventListener("keydown",function(event){

    if(event.key==="Enter"){
        login();
    }

});


/* =========================
   ADMIN GÖSTER
========================= */

function showAdmin(){

    document.getElementById(
        "loginScreen"
    ).style.display="none";

    document.getElementById(
        "adminPanel"
    ).style.display="block";

    loadListings();

}


/* =========================
   OTURUM VARSA AÇ
========================= */

if(adminToken){

    showAdmin();

}


/* =========================
   ÇIKIŞ
========================= */

async function logout(){

    try{

        await fetch("/api/admin-logout",{
            method:"POST",
            headers:{
                "Authorization":
                    "Bearer " + adminToken
            }
        });

    }catch(error){

        console.error(error);

    }

    sessionStorage.removeItem(
        "novaAdminToken"
    );

    adminToken="";

    location.reload();

}


/* =========================
   FOTOĞRAF ÖNİZLEME
========================= */

document.getElementById("imageFile")
.addEventListener("change",function(){

    const file=this.files[0];

    const preview=
        document.getElementById("preview");

    if(!file){

        preview.style.display="none";
        return;

    }

    const reader=new FileReader();

    reader.onload=function(e){

        preview.src=e.target.result;

        preview.style.display="block";

    };

    reader.readAsDataURL(file);

});


/* =========================
   YENİ İLAN EKLE
========================= */

document.getElementById("listingForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    const file=
        document.getElementById("imageFile").files[0];

    if(!file){

        alert("Lütfen fotoğraf seç.");

        return;

    }

    const reader=new FileReader();

    reader.onload=async function(e){

        const ilan={

            title:
                document.getElementById("title").value.trim(),

            type:
                document.getElementById("type").value,

            city:
                document.getElementById("city").value,

            district:
                document.getElementById("district").value.trim(),

            neighborhood:
                document.getElementById("neighborhood").value.trim(),

            price:
                Number(
                    document.getElementById("price").value
                ),

            rooms:
                document.getElementById("rooms").value.trim(),

            area:
                Number(
                    document.getElementById("area").value
                ),

            buildingAge:
                Number(
                    document.getElementById("buildingAge").value
                ) || 0,

            floor:
                document.getElementById("floor").value.trim(),

            totalFloors:
                Number(
                    document.getElementById("totalFloors").value
                ) || 0,

            heating:
                document.getElementById("heating").value,

            bathrooms:
                document.getElementById("bathrooms").value,

            balcony:
                document.getElementById("balcony").value,

            credit:
                document.getElementById("credit").value,

            deed:
                document.getElementById("deed").value,

            image:
                e.target.result,

            description:
                document.getElementById("description")
                .value.trim()

        };


        try{

            const response=
                await fetch("/api/ilanlar",{

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + adminToken
                    },

                    body:
                        JSON.stringify(ilan)

                });


            if(response.status===401){

                alert(
                    "Admin oturumunun süresi dolmuş. Tekrar giriş yap."
                );

                logout();

                return;

            }


            const data=
                await response.json();


            if(data.success){

                showMessage(
                    "✅ İlan başarıyla kaydedildi!",
                    true
                );

                document.getElementById(
                    "listingForm"
                ).reset();

                document.getElementById(
                    "preview"
                ).style.display="none";

                loadListings();

            }else{

                showMessage(
                    "❌ " +
                    (data.error || "İlan kaydedilemedi."),
                    false
                );

            }

        }catch(error){

            console.error(error);

            showMessage(
                "❌ Sunucu bağlantı hatası.",
                false
            );

        }

    };

    reader.readAsDataURL(file);

});


/* =========================
   MESAJ
========================= */

function showMessage(text,success){

    const message=
        document.getElementById("message");

    message.textContent=text;

    message.className=
        success
        ? "message success"
        : "message error";

    message.style.display="block";

    setTimeout(function(){

        message.style.display="none";

    },4000);

}


/* =========================
   İLANLARI GETİR
========================= */

async function loadListings(){

    try{

        const response=
            await fetch("/api/ilanlar");

        const ilanlar=
            await response.json();

        document.getElementById("count")
        .textContent=
            "Toplam " + ilanlar.length + " ilan";

        const container=
            document.getElementById("listings");

        container.innerHTML="";


        if(!Array.isArray(ilanlar) || ilanlar.length===0){

            container.innerHTML=
                '<p class="empty">Henüz ilan yok.</p>';

            return;

        }


        ilanlar.forEach(function(ilan){

            const item=
                document.createElement("div");

            item.className="listing";


            const image=
                document.createElement("img");

            image.src=ilan.image || "";

            image.alt=ilan.title || "İlan";

            item.appendChild(image);


            const title=
                document.createElement("h3");

            title.textContent=
                ilan.title || "";

            item.appendChild(title);


            const info=
                document.createElement("div");

            info.className="info";

            info.textContent=
                (ilan.type || "") +
                " • " +
                (ilan.city || "") +
                " / " +
                (ilan.district || "") +
                " • " +
                (ilan.rooms || "") +
                " • " +
                (ilan.area || 0) +
                " m²";

            item.appendChild(info);


            const extra=
                document.createElement("div");

            extra.className="info";

            extra.textContent=
                "🏢 " +
                (ilan.buildingAge || 0) +
                " yaş • " +
                "Kat: " +
                (ilan.floor || "-") +
                " • " +
                "🔥 " +
                (ilan.heating || "-");

            item.appendChild(extra);


            const price=
                document.createElement("div");

            price.className="price";

            price.textContent=
                Number(ilan.price || 0)
                .toLocaleString("tr-TR") +
                " TL";

            item.appendChild(price);


            const editButton=
                document.createElement("button");

            editButton.className="edit-button";

            editButton.textContent="✏️ Düzenle";

            editButton.onclick=
                function(){
                    openEdit(ilan.id);
                };

            item.appendChild(editButton);


            const deleteButton=
                document.createElement("button");

            deleteButton.className="delete-button";

            deleteButton.textContent="🗑️ Sil";

            deleteButton.onclick=
                function(){
                    deleteListing(ilan.id);
                };

            item.appendChild(deleteButton);


            container.appendChild(item);

        });


    }catch(error){

        console.error(error);

        document.getElementById("count")
        .textContent=
            "İlanlar yüklenemedi.";

    }

}


/* =========================
   DÜZENLE
========================= */

async function openEdit(id){

    try{

        const response=
            await fetch("/api/ilanlar");

        const ilanlar=
            await response.json();

        const ilan=
            ilanlar.find(
                x=>String(x.id)===String(id)
            );


        if(!ilan){

            alert("İlan bulunamadı.");

            return;

        }


        document.getElementById("editId").value=
            ilan.id;

        document.getElementById("editTitle").value=
            ilan.title || "";

        document.getElementById("editType").value=
            ilan.type || "Satılık";

        document.getElementById("editCity").value=
            ilan.city || "İstanbul";

        document.getElementById("editDistrict").value=
            ilan.district || "";

        document.getElementById("editNeighborhood").value=
            ilan.neighborhood || "";

        document.getElementById("editPrice").value=
            ilan.price || "";

        document.getElementById("editRooms").value=
            ilan.rooms || "";

        document.getElementById("editArea").value=
            ilan.area || "";

        document.getElementById("editBuildingAge").value=
            ilan.buildingAge || "";

        document.getElementById("editFloor").value=
            ilan.floor || "";

        document.getElementById("editTotalFloors").value=
            ilan.totalFloors || "";

        document.getElementById("editHeating").value=
            ilan.heating || "";

        document.getElementById("editBathrooms").value=
            ilan.bathrooms || "";

        document.getElementById("editBalcony").value=
            ilan.balcony || "Var";

        document.getElementById("editCredit").value=
            ilan.credit || "Evet";

        document.getElementById("editDeed").value=
            ilan.deed || "";

        document.getElementById("editDescription").value=
            ilan.description || "";


        const preview=
            document.getElementById("editPreview");


        if(ilan.image){

            preview.src=ilan.image;

            preview.style.display="block";

        }else{

            preview.style.display="none";

        }


        document.getElementById("editImageFile").value="";

        document.getElementById("editModal")
        .style.display="block";


    }catch(error){

        console.error(error);

        alert("İlan bilgileri alınamadı.");

    }

}


/* =========================
   FOTOĞRAF ÖNİZLEME
========================= */

document.getElementById("editImageFile")
.addEventListener("change",function(){

    const file=this.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(e){

        const preview=
            document.getElementById("editPreview");

        preview.src=e.target.result;

        preview.style.display="block";

    };

    reader.readAsDataURL(file);

});


/* =========================
   DÜZENLEMEYİ KAYDET
========================= */

async function saveEdit(){

    const id=
        document.getElementById("editId").value;

    const file=
        document.getElementById("editImageFile").files[0];


    try{

        const response=
            await fetch("/api/ilanlar");

        const ilanlar=
            await response.json();

        const mevcut=
            ilanlar.find(
                x=>String(x.id)===String(id)
            );


        if(!mevcut){

            alert("İlan bulunamadı.");

            return;

        }


        if(file){

            const reader=new FileReader();

            reader.onload=
                async function(e){

                    await sendUpdate(
                        id,
                        e.target.result
                    );

                };

            reader.readAsDataURL(file);

        }else{

            await sendUpdate(
                id,
                mevcut.image
            );

        }


    }catch(error){

        console.error(error);

        alert("İlan bilgileri alınamadı.");

    }

}


/* =========================
   GÜNCELLE
========================= */

async function sendUpdate(id,image){

    const updated={

        title:
            document.getElementById("editTitle")
            .value.trim(),

        type:
            document.getElementById("editType")
            .value,

        city:
            document.getElementById("editCity")
            .value,

        district:
            document.getElementById("editDistrict")
            .value.trim(),

        neighborhood:
            document.getElementById("editNeighborhood")
            .value.trim(),

        price:
            Number(
                document.getElementById("editPrice")
                .value
            ),

        rooms:
            document.getElementById("editRooms")
            .value.trim(),

        area:
            Number(
                document.getElementById("editArea")
                .value
            ),

        buildingAge:
            Number(
                document.getElementById("editBuildingAge")
                .value
            ) || 0,

        floor:
            document.getElementById("editFloor")
            .value.trim(),

        totalFloors:
            Number(
                document.getElementById("editTotalFloors")
                .value
            ) || 0,

        heating:
            document.getElementById("editHeating")
            .value,

        bathrooms:
            document.getElementById("editBathrooms")
            .value,

        balcony:
            document.getElementById("editBalcony")
            .value,

        credit:
            document.getElementById("editCredit")
            .value,

        deed:
            document.getElementById("editDeed")
            .value,

        image:image,

        description:
            document.getElementById("editDescription")
            .value.trim()

    };


    try{

        const response=
            await fetch(
                "/api/ilanlar/" + id,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + adminToken
                    },

                    body:
                        JSON.stringify(updated)
                }
            );


        if(response.status===401){

            alert(
                "Admin oturumunun süresi dolmuş."
            );

            logout();

            return;

        }


        const data=
            await response.json();


        if(data.success){

            alert(
                "✅ İlan başarıyla güncellendi!"
            );

            closeModal();

            loadListings();

        }else{

            alert(
                "❌ " +
                (data.error ||
                "İlan güncellenemedi.")
            );

        }


    }catch(error){

        console.error(error);

        alert("❌ Sunucu bağlantı hatası.");

    }

}


/* =========================
   MODAL KAPAT
========================= */

function closeModal(){

    document.getElementById("editModal")
    .style.display="none";

}


/* =========================
   MODAL DIŞINA TIKLAMA
========================= */

document.getElementById("editModal")
.addEventListener("click",function(event){

    if(event.target===this){

        closeModal();

    }

});


/* =========================
   İLAN SİL
========================= */

async function deleteListing(id){

    if(!confirm(
        "Bu ilanı silmek istediğine emin misin?"
    )){

        return;

    }


    try{

        const response=
            await fetch(
                "/api/ilanlar/" + id,
                {
                    method:"DELETE",

                    headers:{
                        "Authorization":
                            "Bearer " + adminToken
                    }
                }
            );


        if(response.status===401){

            alert(
                "Admin oturumunun süresi dolmuş."
            );

            logout();

            return;

        }


        const data=
            await response.json();


        if(data.success){

            alert("✅ İlan silindi!");

            loadListings();

        }else{

            alert(
                "❌ " +
                (data.error ||
                "İlan silinemedi.")
            );

        }


    }catch(error){

        console.error(error);

        alert("❌ Sunucu bağlantı hatası.");

    }

}
